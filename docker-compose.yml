version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: korpus
      POSTGRES_USER: korpus
      POSTGRES_PASSWORD: korpus
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korpus"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: korpus
      MINIO_ROOT_PASSWORD: change-me-in-non-local-environments
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
volumes:
  postgres-data:
  redis-data:
  minio-data:
