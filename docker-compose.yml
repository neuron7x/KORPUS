services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      KORPUS_ENVIRONMENT: local
      KORPUS_DATABASE_URL: sqlite:////data/korpus.db
      KORPUS_OBJECT_ROOT: /data/objects
      KORPUS_AUTH_MODE: dev
      KORPUS_AUDIT_HMAC_KEY_FILE: /run/secrets/audit_hmac_key
      KORPUS_JWT_SECRET_FILE: /run/secrets/jwt_secret
      KORPUS_CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    secrets: [audit_hmac_key, jwt_secret]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["app-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      api:
        condition: service_healthy

  postgres:
    profiles: ["support"]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: korpus
      POSTGRES_USER: korpus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korpus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: ["support"]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]

  minio:
    profiles: ["support"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: korpus-local
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    secrets: [minio_password]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]

  otel-collector:
    profiles: ["support"]
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]

secrets:
  postgres_password:
    file: ./infra/secrets/postgres_password.txt
  minio_password:
    file: ./infra/secrets/minio_password.txt
  audit_hmac_key:
    file: ./infra/secrets/audit_hmac_key.txt
  jwt_secret:
    file: ./infra/secrets/jwt_secret.txt

volumes:
  app-data:
  postgres-data:
  redis-data:
  minio-data:
