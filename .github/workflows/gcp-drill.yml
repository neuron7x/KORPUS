name: GCP disaster-recovery drill

on:
  schedule:
    - cron: "37 3 1 * *"
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PITR_DRILL to create and then delete a temporary Cloud SQL PITR clone.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-production-drill
  cancel-in-progress: false

env:
  GCP_REGION: ${{ vars.GCP_REGION }}

jobs:
  pitr:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.confirmation == 'PITR_DRILL')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_DRILL_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DRILL_DEPLOYER_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Install pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '578.0.0'
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Execute destructive-isolated PITR drill
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: scripts/gcp/drill_cloudsql_pitr.sh
      - name: Preserve DR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gcp-dr-evidence-${{ github.run_id }}
          path: reports/production/dr/
          if-no-files-found: error
          retention-days: 90
