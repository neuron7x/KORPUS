name: scanner-stdlib-diagnostic-nonauthoritative

on:
  pull_request:
    paths:
      - '.github/workflows/scanner-stdlib-diagnostic.yml'
      - 'config/scanner-diagnostics/**'
      - 'scripts/scanner_stdlib_*.py'
      - 'scripts/run_scanner_stdlib_diagnostic.py'
      - 'scripts/install_scanner_compiler.py'
      - 'apps/api/tests/test_scanner_stdlib_*.py'
      - 'docs/scanner-stdlib-diagnostic.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-stdlib-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  paired-native-stdlib-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the complete exact event history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the locked Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Install the exact pinned official compiler archive
        run: |
          python scripts/install_scanner_compiler.py --destination "$RUNNER_TEMP/korpus-pinned-go"
          printf '%s\n' "$RUNNER_TEMP/korpus-pinned-go/go/bin" >> "$GITHUB_PATH"
      - name: Install the existing locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Record paired source-built stdlib observations without admission authority
        run: python scripts/run_scanner_stdlib_diagnostic.py
      - name: Preserve bounded nonauthoritative build and native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scanner-stdlib-diagnostic-${{ github.run_attempt }}
          path: var/scanner-stdlib-diagnostic/
          if-no-files-found: warn
          retention-days: 14
