name: pr88-ascii-uri-repair

# Temporary PR-88-only producer. Publishes tested blobs, never refs or merges.
on:
  pull_request:
    types: [synchronize]
    paths: [.github/workflows/pr88-ascii-uri-repair.yml]
permissions:
  contents: read
concurrency:
  group: pr88-ascii-uri-repair
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'neuron7x/KORPUS' &&
      github.event.pull_request.number == 88 &&
      github.event.pull_request.head.repo.full_name == 'neuron7x/KORPUS' &&
      github.event.pull_request.head.ref == 'research/kb-reference-metadata-gate-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOURCE_HEAD: b8401296ffd760558d364cc53bf8fdb122f220d5
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts:${{ github.workspace }}/apps/api/src
      KORPUS_ENVIRONMENT: test
      KORPUS_SCHEMA_MODE: auto
      KORPUS_DATABASE_URL: sqlite:///${{ github.workspace }}/var/pr88-ascii.db
      KORPUS_OBJECT_ROOT: ${{ github.workspace }}/var/objects
      KORPUS_AUTH_MODE: dev
      KORPUS_DEV_MODE_ACKNOWLEDGEMENT: I_ACKNOWLEDGE_DEV_AUTH_IS_INSECURE
      KORPUS_BIND_HOST: 127.0.0.1
      KORPUS_AUDIT_HMAC_KEY: ci-only-audit-key
      KORPUS_JWT_SECRET: ci-only-jwt-key
    steps:
      - name: Checkout immutable repair request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source lease and isolate original tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          test "$(git diff --name-only "$SOURCE_HEAD" "$EVENT_HEAD")" = '.github/workflows/pr88-ascii-uri-repair.yml'
          git checkout --detach "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"
          mkdir -p var
      - name: Install Python 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install hash-locked verification dependencies
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Verify ASCII URI admission and unchanged metadata boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from scripts import check_module_budget as budget_gate
          from scripts.generate_manifest import build_manifest, write_manifest
          from scripts.verify_package_build_identity import verify as verify_build
          from scripts.verify_source_manifest import verify as verify_source

          root = Path.cwd()
          source = root / 'scripts/kb_reference_admission.py'
          test = root / 'apps/api/tests/test_kb_reference_ascii_uri.py'
          document = root / 'docs/research/KB_REFERENCE_STAGING.md'
          manifest_path = root / 'SOURCE_MANIFEST.json'
          package_path = root / 'PACKAGE_BUILD.json'
          original = source.read_text(encoding='utf-8')
          original_shape = budget_gate.measure()['scripts/kb_reference_admission.py']
          old_manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert build_manifest(root) == old_manifest
          assert verify_source(root)['valid'] is True and verify_build(root) == []
          assert not test.exists()
          test_source = r'''"""Offline ASCII URI admission and Unicode metadata compatibility controls."""
          from __future__ import annotations

          import json
          from pathlib import Path

          import pytest

          from scripts import kb_reference_admission as gate

          RAW_PATHS = (
              "caf\u00e9", "cafe\u0301", "\u0416", "\u4e2d", "\U0001f600",
              "\u0080", "\u0085", "\u2028", "\ud800", "\udfff",
          )

          def _row(index: int, url: str) -> dict[str, object]:
              return {
                  "source_id": f"SRC_ASCII_{index}",
                  "title": "Synthetic reference", "publisher": "Synthetic publisher",
                  "url": url, "category_ids": ["T07_DATA_PROVENANCE_AND_RIGHTS"],
                  "access_model": "PUBLIC_LANDING", "reuse_status": "UNASSESSED",
                  "integration_mode": "METADATA_ONLY",
              }

          def _verify(tmp_path: Path, rows: list[dict[str, object]]) -> dict[str, object]:
              catalog = tmp_path / "catalog.jsonl"
              catalog.write_text("".join(json.dumps(row) + "\n" for row in rows), encoding="utf-8")
              result = gate.verify_catalog(catalog)
              assert result["candidate_status"] == "BLOCKED"
              assert result["rights_cleared"] == result["acquired"] == result["reviewed"] == 0
              assert result["indexable"] == 0
              assert result["production_authorized"] is False
              assert result["network_access_performed"] is False
              return result

          @pytest.mark.parametrize("path", RAW_PATHS)
          def test_literal_non_ascii_url_codepoints_are_refused(path: str) -> None:
              assert gate._public_https_url("https://example.org/" + path) is False

          @pytest.mark.parametrize("path", [
              "caf%C3%A9", "caf%c3%a9", "cafe%CC%81", "%E4%B8%AD",
              "%F0%9F%98%80", "path%3F%23",
          ])
          def test_ascii_percent_encoded_path_data_remains_admissible(path: str) -> None:
              assert gate._public_https_url("https://example.org/" + path) is True

          @pytest.mark.parametrize("literal,encoded", [
              ("caf\u00e9", "caf%C3%A9"), ("cafe\u0301", "cafe%CC%81"),
              ("\u4e2d", "%E4%B8%AD"),
          ])
          def test_mixed_iri_uri_catalog_cannot_pass(
              tmp_path: Path, literal: str, encoded: str
          ) -> None:
              rows = [_row(0, "https://example.org/" + literal), _row(1, "https://example.org/" + encoded)]
              result = _verify(tmp_path, rows)
              assert result["structure_status"] == "FAIL"
              assert result["source_records"] == 1
              assert result["errors"] == ["line 1: invalid metadata-only source record"]

          @pytest.mark.parametrize("field", ["title", "publisher"])
          def test_unicode_metadata_is_not_subject_to_url_ascii_policy(
              tmp_path: Path, field: str
          ) -> None:
              row = _row(0, "https://example.org/caf%C3%A9")
              row[field] = "\u0414\u043e\u0432\u0456\u0434\u043d\u0438\u043a caf\u00e9 \u4e2d"
              result = _verify(tmp_path, [row])
              assert result["structure_status"] == "PASS"
              assert result["source_records"] == 1
              assert result["errors"] == []

          @pytest.mark.parametrize("url", [
              "https://xn--bcher-kva.example/caf%C3%A9", "https://EXAMPLE.org/~valid%20path",
          ])
          def test_ascii_host_and_uri_spellings_remain_admissible(url: str) -> None:
              assert gate._public_https_url(url) is True
          '''
          test.write_text(test_source, encoding='utf-8')
          subprocess.run([sys.executable, '-m', 'ruff', 'format', str(test)], check=True)

          def run_tests(paths, label):
              output = root / ('var/pr88-ascii-' + label + '.xml')
              command = [sys.executable, '-m', 'pytest', '-q', *paths, '-p', 'no:cacheprovider', '--tb=short', '--junitxml=' + str(output)]
              result = subprocess.run(command, capture_output=True, text=True, check=False, timeout=300)
              text = result.stdout + result.stderr
              (root / ('var/pr88-ascii-' + label + '.log')).write_text(text, encoding='utf-8')
              totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
              for suite in ET.parse(output).getroot().iter('testsuite'):
                  for key in totals:
                      totals[key] += int(suite.get(key, '0'))
              print(label, json.dumps(totals), 'exit', result.returncode)
              if result.returncode:
                  print(text[-5000:])
              assert totals['errors'] == totals['skipped'] == 0, totals
              return result.returncode, totals

          code, baseline = run_tests([str(test)], 'baseline')
          assert code == 1 and baseline == {'tests': 23, 'failures': 13, 'errors': 0, 'skipped': 0}, baseline
          old_guard = 'any(ord(c) <= 32 or ord(c) == 127 for c in url)'
          new_guard = 'any(ord(c) <= 32 or ord(c) >= 127 for c in url)'
          assert original.count(old_guard) == 1
          repaired = original.replace(old_guard, new_guard)
          source.write_text(repaired, encoding='utf-8')
          assert budget_gate.measure()['scripts/kb_reference_admission.py'] == original_shape
          old_doc = document.read_text(encoding='utf-8')
          invocation = 'Run `python scripts/kb_reference_admission.py` from any directory. The default\ncatalog is'
          assert old_doc.count(invocation) == 1
          doc = old_doc.replace(invocation, 'From the repository root, run `python scripts/kb_reference_admission.py`.\nUse an absolute script path when invoking from another directory. The default\ncatalog is')
          doc += '\n## ASCII URL spelling\n\nThe URL field accepts ASCII URI spelling, not literal non-ASCII IRIs. Non-ASCII\nURL code points are refused before parsing; use a reviewed percent-encoded URI\nfor an international path and an ASCII IDNA hostname where applicable. This\ngate does not perform IRI conversion, Unicode normalization, DNS resolution or\nremote resource-equivalence discovery. Percent-encoded path bytes remain data;\nUnicode titles and publishers remain supported. This closes mixed literal/encoded\nidentity admission without adding a normalization dependency or granting rights.\n\nReferences: RFC 3986 section 2 and RFC 3987 section 3.1,\nhttps://www.rfc-editor.org/rfc/rfc3986.html and\nhttps://www.rfc-editor.org/rfc/rfc3987.html .\n'
          document.write_text(doc, encoding='utf-8')
          subprocess.run(['git', 'add', '--', str(test)], check=True)
          manifest = write_manifest(root, manifest_path, kind='source')
          assert manifest['file_count'] == old_manifest['file_count'] + 1 == 2126
          before_records = {item['path']: item for item in old_manifest['files']}
          after_records = {item['path']: item for item in manifest['files']}
          assert set(after_records) - set(before_records) == {str(test.relative_to(root))}
          assert not set(before_records) - set(after_records)
          assert sorted(path for path in before_records if before_records[path] != after_records[path]) == ['docs/research/KB_REFERENCE_STAGING.md', 'scripts/kb_reference_admission.py']
          package = package_path.read_text(encoding='utf-8')
          assert package.count(old_manifest['root_sha256']) == 1
          package_path.write_text(package.replace(old_manifest['root_sha256'], manifest['root_sha256']), encoding='utf-8')
          assert verify_source(root)['valid'] is True and verify_build(root) == []
          paths = [str(path) for path in sorted((root / 'apps/api/tests').glob('test_kb_reference_*.py'))]
          paths.append('apps/api/tests/test_gate_parity.py::test_every_module_is_in_the_budget')
          paths += [str(path) for path in sorted((root / 'apps/api/tests').glob('test_*budget*.py'))]
          code, focused = run_tests(paths, 'focused')
          assert code == 0 and focused == {'tests': 166, 'failures': 0, 'errors': 0, 'skipped': 0}, focused
          controls = {}
          mutations = {
              'non_ascii_guard_removed': repaired.replace(new_guard, old_guard),
              'encoded_uri_data_over_rejected': repaired.replace('            or "#" in url\n', '            or "#" in url or "%" in url\n'),
              'unicode_metadata_over_rejected': repaired.replace('and row[key] == row[key].strip()', 'and row[key] == row[key].strip() and row[key].isascii()'),
          }
          try:
              for label, mutation in mutations.items():
                  assert mutation != repaired
                  source.write_text(mutation, encoding='utf-8')
                  code, counts = run_tests([str(test)], label)
                  assert code == 1 and counts['failures'] > 0, counts
                  controls[label] = counts
          finally:
              source.write_text(repaired, encoding='utf-8')
          code, restored = run_tests(paths, 'restored')
          assert code == 0 and restored == focused
          assert budget_gate.measure()['scripts/kb_reference_admission.py'] == original_shape
          assert verify_source(root)['valid'] is True and verify_build(root) == []
          commands = [
              [sys.executable, '-m', 'ruff', 'check', str(source), str(test)],
              [sys.executable, '-m', 'ruff', 'format', '--check', str(source), str(test)],
              [sys.executable, '-m', 'mypy', str(source)],
              [sys.executable, 'scripts/check_module_budget.py'],
              [sys.executable, 'scripts/check_budget_raises_are_named.py', '--base', os.environ['SOURCE_HEAD']],
              [sys.executable, 'scripts/verify_source_manifest.py'],
              [sys.executable, 'scripts/verify_package_build_identity.py'],
              ['git', 'diff', 'HEAD', '--check'],
          ]
          for command in commands:
              subprocess.run(command, check=True)
          expected = sorted(['PACKAGE_BUILD.json', 'SOURCE_MANIFEST.json', str(test.relative_to(root)), 'docs/research/KB_REFERENCE_STAGING.md', 'scripts/kb_reference_admission.py'])
          actual = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines()
          assert sorted(actual) == expected, actual
          assert not subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).strip()
          receipt = {
              'schema': 'korpus.pr88-ascii-uri-repair.v1', 'status': 'VERIFIED_NOT_ADMITTED',
              'original_head': os.environ['SOURCE_HEAD'], 'repair_request_head': os.environ['EVENT_HEAD'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'baseline': baseline,
              'focused': focused, 'restored': restored, 'guard_controls': controls,
              'module_shape_unchanged': True, 'existing_budgets_unchanged': True,
              'source_file_count': manifest['file_count'], 'source_manifest_root_sha256': manifest['root_sha256'],
              'changed_paths': expected, 'quality_commands': commands,
              'merge_authorized': False, 'production_authorized': False,
          }
          (root / 'var/pr88-ascii-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Publish tested unreferenced blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path
          api = 'https://api.github.com/repos/neuron7x/KORPUS'
          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(api + path, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }, method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          pr = request('/pulls/88')
          assert pr['state'] == 'open' and not pr['merged']
          assert pr['head']['sha'] == os.environ['EVENT_HEAD']
          assert pr['head']['ref'] == 'research/kb-reference-metadata-gate-20261021'
          assert pr['base']['ref'] == 'main'
          path = Path('var/pr88-ascii-receipt.json')
          receipt = json.loads(path.read_text(encoding='utf-8'))
          assert receipt['status'] == 'VERIFIED_NOT_ADMITTED'
          assert receipt['focused'] == receipt['restored'] == {'tests': 166, 'failures': 0, 'errors': 0, 'skipped': 0}
          assert receipt['changed_paths'] == ['PACKAGE_BUILD.json', 'SOURCE_MANIFEST.json', 'apps/api/tests/test_kb_reference_ascii_uri.py', 'docs/research/KB_REFERENCE_STAGING.md', 'scripts/kb_reference_admission.py']
          blobs = []
          for name in receipt['changed_paths']:
              data = Path(name).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              obj = request('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode('ascii')})
              assert obj['sha'] == expected
              blobs.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': expected, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          receipt['blobs'] = blobs
          receipt['status'] = 'VERIFIED_BLOBS_NOT_ADMITTED'
          text = json.dumps(receipt, indent=2) + '\n'
          path.write_text(text, encoding='utf-8')
          print('PR88_ASCII_RECEIPT_BEGIN\n' + text + 'PR88_ASCII_RECEIPT_END')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## PR88 ASCII repair evidence, not merge authorization\n\n```json\n' + text + '```\n')
          PY
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr88-ascii-uri-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/pr88-ascii-*.json
            var/pr88-ascii-*.xml
            var/pr88-ascii-*.log
          if-no-files-found: error
          retention-days: 7
