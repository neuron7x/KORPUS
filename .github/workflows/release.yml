name: release-candidate

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-release-candidate:
    name: package-release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Assert canonical candidate-build context
        run: bash scripts/package_production_release.sh --check-candidate-context
      - name: Install Node 22.23.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          check-latest: false
      - name: Install locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
          npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild release-bound evidence
        run: |
          python scripts/check_release_identity.py --require-git-tag
          make validate PY=python
          make production-exact-environment PY=python
          make api-test PY=python
          make api-lint PY=python
          npm --prefix apps/web run lint
          npm --prefix apps/web run test
          npm --prefix apps/web run build
          make eval mutation migration-gate scale operational-gate PY=python
          make production-postgres-security PY=python
          make sqlite-recovery-drill PY=python
          make audit-closure PY=python
          make production-hard-predicates-evidence PY=python
          make release-truth PY=python
          make assemble-assurance PY=python
          make snapshot PY=python
          PYTHONPATH=scripts python scripts/verify_release_evidence.py
      - name: Build deterministic release candidate
        id: package
        shell: bash
        env:
          KORPUS_PRODUCTION_ASSURANCE_SIGNING_KEY_PEM: ${{ secrets.KORPUS_PRODUCTION_ASSURANCE_SIGNING_KEY_PEM }}
          KORPUS_HOSTED_BUILDER_SIGNING_KEY_PEM: ${{ secrets.KORPUS_HOSTED_BUILDER_SIGNING_KEY_PEM }}
          KORPUS_RELEASE_SIGNING_KEY_PEM: ${{ secrets.KORPUS_RELEASE_SIGNING_KEY_PEM }}
          KORPUS_TRUSTED_PRODUCTION_ASSURANCE_SIGNER_SHA256: ${{ secrets.KORPUS_TRUSTED_PRODUCTION_ASSURANCE_SIGNER_SHA256 }}
          KORPUS_TRUSTED_HOSTED_BUILDER_SIGNER_SHA256: ${{ secrets.KORPUS_TRUSTED_HOSTED_BUILDER_SIGNER_SHA256 }}
          KORPUS_TRUSTED_RELEASE_SIGNER_SHA256: ${{ secrets.KORPUS_TRUSTED_RELEASE_SIGNER_SHA256 }}
          KORPUS_TRUSTED_BUILDER_ID: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          python scripts/verify_source_manifest.py
          for secret_name in \
            KORPUS_PRODUCTION_ASSURANCE_SIGNING_KEY_PEM \
            KORPUS_HOSTED_BUILDER_SIGNING_KEY_PEM \
            KORPUS_RELEASE_SIGNING_KEY_PEM \
            KORPUS_TRUSTED_PRODUCTION_ASSURANCE_SIGNER_SHA256 \
            KORPUS_TRUSTED_HOSTED_BUILDER_SIGNER_SHA256 \
            KORPUS_TRUSTED_RELEASE_SIGNER_SHA256; do
            test -n "${!secret_name}" || { echo "required release secret is absent: ${secret_name}" >&2; exit 1; }
          done
          key_dir="$(mktemp -d "${RUNNER_TEMP}/korpus-release-keys.XXXXXX")"
          trap 'rm -rf "$key_dir"' EXIT
          umask 077
          printf '%s\n' "$KORPUS_PRODUCTION_ASSURANCE_SIGNING_KEY_PEM" > "$key_dir/production-assurance.pem"
          printf '%s\n' "$KORPUS_HOSTED_BUILDER_SIGNING_KEY_PEM" > "$key_dir/hosted-builder.pem"
          printf '%s\n' "$KORPUS_RELEASE_SIGNING_KEY_PEM" > "$key_dir/release.pem"
          python scripts/release_attestation.py sign \
            --manifest reports/PRODUCTION_ASSURANCE_REPORT.json \
            --key "$key_dir/production-assurance.pem" \
            --out reports/PRODUCTION_ASSURANCE_REPORT.attestation.json
          PYTHONPATH=apps/api/src:scripts python scripts/verify_production_assurance.py
          # The guarded production wrapper invokes scripts/package_repository.sh.
          KORPUS_HOSTED_BUILDER_SIGNING_KEY="$key_dir/hosted-builder.pem" \
            KORPUS_RELEASE_SIGNING_KEY="$key_dir/release.pem" \
            bash scripts/package_production_release.sh
          stem="$(python -c 'import sys; sys.path.insert(0, "scripts"); from release_identity import load_release_identity; print(load_release_identity()["artifact_stem"])')"
          for output in \
            "dist/${stem}.zip" \
            "dist/${stem}.release-manifest.json" \
            "dist/${stem}.release-attestation.json" \
            "dist/${stem}.builder-provenance.json" \
            "dist/${stem}.builder-attestation.json" \
            "dist/${stem}.candidate-admission.json" \
            "dist/${stem}.candidate.sha256"; do
            test -s "$output"
          done
          echo "artifact=dist/${stem}.zip" >> "$GITHUB_OUTPUT"
          echo "release_manifest=dist/${stem}.release-manifest.json" >> "$GITHUB_OUTPUT"
          echo "release_attestation=dist/${stem}.release-attestation.json" >> "$GITHUB_OUTPUT"
          echo "builder_provenance=dist/${stem}.builder-provenance.json" >> "$GITHUB_OUTPUT"
          echo "builder_attestation=dist/${stem}.builder-attestation.json" >> "$GITHUB_OUTPUT"
          echo "candidate_admission=dist/${stem}.candidate-admission.json" >> "$GITHUB_OUTPUT"
          echo "checksums=dist/${stem}.candidate.sha256" >> "$GITHUB_OUTPUT"
      - name: Upload blocked candidate for isolated hosted attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: korpus-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.release_manifest }}
            ${{ steps.package.outputs.release_attestation }}
            ${{ steps.package.outputs.builder_provenance }}
            ${{ steps.package.outputs.builder_attestation }}
            ${{ steps.package.outputs.candidate_admission }}
            ${{ steps.package.outputs.checksums }}
            reports/PRODUCTION_ASSURANCE_REPORT.attestation.json
          if-no-files-found: error
          retention-days: 1

  attest-candidate:
    name: attest-candidate
    needs: package-release-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download blocked release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: korpus-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-candidate
      - name: Generate GitHub OIDC candidate attestations
        id: github-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-candidate/dist/*
            release-candidate/reports/PRODUCTION_ASSURANCE_REPORT.attestation.json
      - name: Verify and retain the hosted artifact receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="${{ steps.github-attestation.outputs.bundle-path }}"
          test -s "$bundle"
          mapfile -t artifacts < <(find release-candidate/dist -maxdepth 1 -type f -name 'KORPUS_SYSTEM_*.zip' -print)
          test "${#artifacts[@]}" -eq 1
          gh attestation verify "${artifacts[0]}" --repo "$GITHUB_REPOSITORY" --bundle "$bundle"
          cp "$bundle" release-candidate/dist/KORPUS_GITHUB_HOSTED_ATTESTATION.sigstore.json
      - name: Upload OIDC-attested candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: korpus-candidate-${{ github.ref_name }}
          path: |
            release-candidate/dist/*
            release-candidate/reports/PRODUCTION_ASSURANCE_REPORT.attestation.json
          if-no-files-found: error
          retention-days: 30
