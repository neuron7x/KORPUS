name: pr88-url-component-repair

# Temporary PR-88-only producer. The immutable first producer is reused with
# two index-handling corrections; no tests, assertions or gates are removed.
on:
  pull_request:
    types: [synchronize]
    paths: [.github/workflows/pr88-url-component-repair.yml]
permissions:
  contents: read
concurrency:
  group: pr88-url-component-repair
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'neuron7x/KORPUS' &&
      github.event.pull_request.number == 88 &&
      github.event.pull_request.head.repo.full_name == 'neuron7x/KORPUS' &&
      github.event.pull_request.head.ref == 'research/kb-reference-metadata-gate-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOURCE_HEAD: bfe334fe8846a4e1e5328767f010302f006e795b
      REQUEST_PARENT: f9cc3cdf471da4471e119cf1589a933a4c209bbd
      PRODUCER_BLOB: ca8a9cf6ee7384862c10542d96eb39f35f19a3af
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts:${{ github.workspace }}/apps/api/src
      KORPUS_ENVIRONMENT: test
      KORPUS_SCHEMA_MODE: auto
      KORPUS_DATABASE_URL: sqlite:///${{ github.workspace }}/var/pr88-url.db
      KORPUS_OBJECT_ROOT: ${{ github.workspace }}/var/objects
      KORPUS_AUTH_MODE: dev
      KORPUS_DEV_MODE_ACKNOWLEDGEMENT: I_ACKNOWLEDGE_DEV_AUTH_IS_INSECURE
      KORPUS_BIND_HOST: 127.0.0.1
      KORPUS_AUDIT_HMAC_KEY: ci-only-audit-key
      KORPUS_JWT_SECRET: ci-only-jwt-key
    steps:
      - name: Checkout immutable repair request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the original producer and isolate original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$REQUEST_PARENT"
          test "$(git diff --name-only "$SOURCE_HEAD" "$EVENT_HEAD")" = '.github/workflows/pr88-url-component-repair.yml'
          git show "$REQUEST_PARENT:.github/workflows/pr88-url-component-repair.yml" > "$RUNNER_TEMP/pr88-original-producer.yml"
          test "$(git hash-object "$RUNNER_TEMP/pr88-original-producer.yml")" = "$PRODUCER_BLOB"
          git checkout --detach "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"
          mkdir -p var
      - name: Install Python 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install hash-locked verification dependencies
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Execute unchanged repair controls with correct staged inventory
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import yaml

          path = Path(os.environ['RUNNER_TEMP']) / 'pr88-original-producer.yml'
          data = path.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == os.environ['PRODUCER_BLOB']
          workflow = yaml.safe_load(data)
          step = next(item for item in workflow['jobs']['prepare']['steps'] if item['name'] == 'Verify original refusal gap and exact candidate repair')
          shell = step['run']
          assert shell.startswith("python - <<'PY'\n") and shell.endswith('PY\n')
          program = shell[len("python - <<'PY'\n"):-len('PY\n')]
          old = 'manifest = write_manifest(root, manifest_path, kind="source")'
          assert program.count(old) == 1
          program = program.replace(old, 'subprocess.run(["git", "add", "--", str(test)], check=True)\n' + old)
          old = '["git", "diff", "--name-only"]'
          assert program.count(old) == 1
          program = program.replace(old, '["git", "diff", "HEAD", "--name-only"]')
          exec(compile(program, 'immutable-pr88-producer-with-staged-inventory', 'exec'), {'__name__': '__main__'})
          receipt_path = Path('var/pr88-url-receipt.json')
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          receipt['producer_recovery'] = {
              'failed_run': 39571190467,
              'original_producer_blob': os.environ['PRODUCER_BLOB'],
              'new_test_staged_before_manifest': True,
              'inventory_diff_includes_index_and_worktree': True,
              'tests_and_assertions_unchanged': True,
          }
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish tested unreferenced blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import yaml

          data = (Path(os.environ['RUNNER_TEMP']) / 'pr88-original-producer.yml').read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == os.environ['PRODUCER_BLOB']
          workflow = yaml.safe_load(data)
          step = next(item for item in workflow['jobs']['prepare']['steps'] if item['name'] == 'Publish tested unreferenced blobs only')
          shell = step['run']
          assert shell.startswith("python - <<'PY'\n") and shell.endswith('PY\n')
          program = shell[len("python - <<'PY'\n"):-len('PY\n')]
          exec(compile(program, 'immutable-pr88-blob-publisher', 'exec'), {'__name__': '__main__'})
          PY
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr88-url-component-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/pr88-url-*.json
            var/pr88-url-*.xml
            var/pr88-url-*.log
          if-no-files-found: error
          retention-days: 7
