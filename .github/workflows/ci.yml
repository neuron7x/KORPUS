name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api/src
  KORPUS_ENVIRONMENT: test
  KORPUS_SCHEMA_MODE: auto
  KORPUS_DATABASE_URL: sqlite:///${{ github.workspace }}/var/ci.db
  KORPUS_OBJECT_ROOT: ${{ github.workspace }}/var/objects
  KORPUS_AUTH_MODE: dev
  KORPUS_DEV_MODE_ACKNOWLEDGEMENT: I_ACKNOWLEDGE_DEV_AUTH_IS_INSECURE
  KORPUS_BIND_HOST: 127.0.0.1
  KORPUS_AUDIT_HMAC_KEY: ci-only-audit-key
  KORPUS_JWT_SECRET: ci-only-jwt-key

jobs:
  assurance:
    name: assurance
    uses: ./.github/workflows/assurance.yml

  repository:
    name: repository-contract
    needs: assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Download current source evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-assurance-${{ github.run_attempt }}
          path: var
      - name: Validate repository and GitHub policy
        run: |
          set -o pipefail
          make validate PY=python MUTATION_REPORT=var/mutation-report.json \
            REPOSITORY_CONTEXT=SOURCE_CHECKOUT PRODUCTION_CONTEXT=SOURCE_CHECKOUT \
            CURRENT_TRUTH_CONTEXT=SOURCE_CHECKOUT \
            PRODUCTION_REPORT=var/source-production-hard-predicates.json \
            PUBLISH_CURRENT_REPORTS=0 REQUIREMENTS_CHECK=1 \
            2>&1 | tee var/repository-contract.log
      - name: Preserve repository diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-diagnostics-${{ github.run_attempt }}
          path: |
            var/repository-contract.log
            var/*freshness*.json
            var/*current-truth*.json
            var/ci-mirror.json
            var/gate-closure.json
            var/source-production-hard-predicates.json
          if-no-files-found: warn
          retention-days: 14

  api-test:
    name: api-tests
    needs: assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Download PostgreSQL coverage from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-postgres-${{ github.run_attempt }}
          path: var
      - name: Run API tests and coverage ratchet
        run: |
          set -o pipefail
          make coverage-ratchet PY=python 2>&1 | tee var/api-coverage.log
      - name: Verify determinism
        run: |
          set -o pipefail
          make determinism-gate PY=python 2>&1 | tee var/determinism.log
      - name: Verify stress controls
        run: |
          set -o pipefail
          make stress-gate PY=python 2>&1 | tee var/stress.log
      - name: Preserve API and coverage diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-coverage-diagnostics-${{ github.run_attempt }}
          path: |
            var/pytest.xml
            var/coverage*.json
            var/coverage*.data
            var/coverage.xml
            var/api-coverage.log
            var/determinism.log
            var/stress.log
          if-no-files-found: warn
          retention-days: 14

  api-quality:
    name: api-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Run static quality gate
        run: make api-lint PY=python

  web-test:
    name: web-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22.16.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          check-latest: false
      - name: Install exact web dependency graph
        run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
      - name: Run web negative controls and build
        run: |
          npm --prefix apps/web run lint
          npm --prefix apps/web run test
          npm --prefix apps/web run build
