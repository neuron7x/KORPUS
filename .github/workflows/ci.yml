name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api/src
  KORPUS_ENVIRONMENT: test
  KORPUS_SCHEMA_MODE: auto
  KORPUS_DATABASE_URL: sqlite:///${{ github.workspace }}/var/ci.db
  KORPUS_OBJECT_ROOT: ${{ github.workspace }}/var/objects
  KORPUS_AUTH_MODE: dev
  KORPUS_DEV_MODE_ACKNOWLEDGEMENT: I_ACKNOWLEDGE_DEV_AUTH_IS_INSECURE
  KORPUS_BIND_HOST: 127.0.0.1
  KORPUS_AUDIT_HMAC_KEY: ci-only-audit-key
  KORPUS_JWT_SECRET: ci-only-jwt-key

jobs:
  repository:
    name: repository-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Validate repository and GitHub policy
        run: make validate PY=python
      - name: Preserve repository validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-validation
          overwrite: true
          path: |
            var/infrastructure-validation.json
            var/kubernetes-validation.json
            var/supply-chain-inventory.json
            var/environment-observation.json
            var/builtin-security-gate.json
          if-no-files-found: warn
          retention-days: 30

  api-test:
    name: api-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Run API test and local coverage gates
        run: |
          make api-test PY=python
          make determinism-gate PY=python
          make stress-gate PY=python
      - name: Preserve API evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-evidence
          overwrite: true
          path: |
            var/pytest.xml
            var/coverage.xml
            var/coverage.json
            var/determinism-gate.json
            var/stress-gate.json
          if-no-files-found: warn
          retention-days: 30

  api-quality:
    name: api-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Run static quality gate
        run: make api-lint PY=python
      - name: Preserve quality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-quality-evidence
          overwrite: true
          path: var/quality-report.json
          if-no-files-found: error
          retention-days: 30

  web-test:
    name: web-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 22.16.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.16.0
          check-latest: false
      - name: Install Python 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Install exact web dependency graph
        run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
      - name: Verify generated browser contracts
        run: make web-contract-check PY=python
      - name: Run web negative controls and build
        run: |
          npm --prefix apps/web run lint
          npm --prefix apps/web run test
          npm --prefix apps/web run build
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          KORPUS_BROWSER_BIN="$browser" npm --prefix apps/web run test:browser
