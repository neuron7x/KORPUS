name: assurance

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api/src
  KORPUS_ENVIRONMENT: test
  KORPUS_SCHEMA_MODE: auto
  KORPUS_DATABASE_URL: sqlite:///${{ github.workspace }}/var/assurance.db
  KORPUS_OBJECT_ROOT: ${{ github.workspace }}/var/objects
  KORPUS_AUTH_MODE: dev
  KORPUS_DEV_MODE_ACKNOWLEDGEMENT: I_ACKNOWLEDGE_DEV_AUTH_IS_INSECURE
  KORPUS_BIND_HOST: 127.0.0.1
  KORPUS_AUDIT_HMAC_KEY: ci-only-audit-key
  KORPUS_JWT_SECRET: ci-only-jwt-key

jobs:
  research-assurance:
    name: research-assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Verify exact locked environment
        run: make production-exact-environment PY=python
      - name: Verify source checkout predicates
        run: |
          mkdir -p var/objects
          set -o pipefail
          make production-hard-predicates PY=python PRODUCTION_CONTEXT=SOURCE_CHECKOUT \
            PRODUCTION_REPORT=var/source-production-hard-predicates.json \
            2>&1 | tee var/source-predicates.log
      - name: Execute evaluation campaign
        run: |
          set -o pipefail
          make eval PY=python 2>&1 | tee var/eval.log
      - name: Execute mutation campaign
        run: |
          set -o pipefail
          make mutation PY=python MUTATION_ARGS=--no-portable 2>&1 | tee var/mutation.log
      - name: Verify migrations
        run: |
          set -o pipefail
          make migration-gate PY=python 2>&1 | tee var/migration.log
      - name: Measure scale
        run: |
          set -o pipefail
          make scale PY=python 2>&1 | tee var/scale.log
      - name: Verify operational evidence
        run: |
          set -o pipefail
          make operational-gate PY=python 2>&1 | tee var/operational-gate.log
          python scripts/check_evidence_freshness.py
          python scripts/check_mutation_report_freshness.py --report var/mutation-report.json
      - name: Upload current source evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-assurance-${{ github.run_attempt }}
          path: |
            var/eval-report.json
            var/mutation-report.json
            var/migration-report.json
            var/scale-report.json
            var/operational-gate.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve assurance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-assurance-diagnostics-${{ github.run_attempt }}
          path: |
            var/source-predicates.log
            var/source-production-hard-predicates.json
            var/eval.log
            var/mutation.log
            var/mutation-shard-*.log
            var/mutation-shards/*.json
            var/migration.log
            var/scale.log
            var/operational-gate.log
            var/*-report.json
            var/operational-gate.json
            var/*freshness*.json
          if-no-files-found: warn
          retention-days: 14

  postgres:
    name: postgres-full-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python 3.12.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Run PostgreSQL 17 and pgvector coverage suite
        env:
          PYTHON: python
        run: |
          mkdir -p var
          set -o pipefail
          scripts/run_postgres_coverage.sh 2>&1 | tee var/postgres-coverage.log
          for report in var/coverage-postgres.json var/coverage-postgres.data var/coverage-postgres-receipt.json; do
            if ! test -s "$report"; then
              printf '::error::missing or empty required coverage output: %s\n' "$report"
              exit 1
            fi
          done
      - name: Verify production PostgreSQL security gate
        env:
          PYTHON: python
        run: |
          set -o pipefail
          make production-postgres-security PY=python 2>&1 | tee var/postgres-security.log
      - name: Upload PostgreSQL coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-postgres-${{ github.run_attempt }}
          path: |
            var/coverage-postgres.json
            var/coverage-postgres.data
            var/coverage-postgres-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-diagnostics-${{ github.run_attempt }}
          path: |
            var/postgres-coverage.log
            var/postgres-security.log
            var/coverage-postgres.json
            var/coverage-postgres.data
            var/coverage-postgres-receipt.json
            var/production/postgres_security-gate.json
            var/postgres-security/
          if-no-files-found: warn
          retention-days: 14
