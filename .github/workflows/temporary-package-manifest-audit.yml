name: temporary-package-manifest-audit
on:
  push:
    branches: [integration/canonical-main-20261021]
    paths:
      - .github/workflows/temporary-package-manifest-audit.yml
      - scripts/verify_package.py
      - apps/api/tests/test_package_zip_safety.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install Python 3.12.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Prove parent accepts duplicate manifest path
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/verify_package.py /tmp/fixed_verify_package.py
          git show HEAD^:scripts/verify_package.py > scripts/verify_package.py
          if python -m pytest -q apps/api/tests/test_package_zip_safety.py -k duplicate_distribution_manifest_path; then
            echo "negative control unexpectedly passed on parent" >&2
            exit 1
          fi
          cp /tmp/fixed_verify_package.py scripts/verify_package.py
      - name: Verify repaired package boundary
        run: |
          python -m pytest -q apps/api/tests/test_package_zip_safety.py apps/api/tests/test_snapshot_admission.py apps/api/tests/test_distribution_runtime_boundary.py --junitxml=var/package-manifest-audit.xml
          python -m ruff check scripts/verify_package.py apps/api/tests/test_package_zip_safety.py
          python -m ruff format --check scripts/verify_package.py apps/api/tests/test_package_zip_safety.py
          python scripts/check_module_budget.py
      - name: Build final clean manifest payload
        shell: bash
        run: |
          set -euo pipefail
          git rm --cached .github/workflows/temporary-package-manifest-audit.yml
          python scripts/generate_manifest.py
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("SOURCE_MANIFEST.json").read_text())
          p=Path("PACKAGE_BUILD.json")
          package=json.loads(p.read_text())
          package["source_manifest_root_sha256"]=manifest["root_sha256"]
          p.write_text(json.dumps(package, ensure_ascii=False, indent=2)+"\\n")
          PY
          python scripts/verify_source_manifest.py
          python scripts/verify_package_build_identity.py
          mkdir -p var/final-payload/scripts var/final-payload/apps/api/tests
          cp scripts/verify_package.py var/final-payload/scripts/verify_package.py
          cp apps/api/tests/test_package_zip_safety.py var/final-payload/apps/api/tests/test_package_zip_safety.py
          cp SOURCE_MANIFEST.json PACKAGE_BUILD.json var/final-payload/
      - name: Upload bounded verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-manifest-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/package-manifest-audit.xml
            var/final-payload/
          if-no-files-found: error
          retention-days: 14
