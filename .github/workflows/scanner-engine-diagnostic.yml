name: scanner-engine-diagnostic-nonauthoritative

on:
  pull_request:
    paths:
      - '.github/workflows/scanner-engine-diagnostic.yml'
      - 'scripts/scanner_engine_*.py'
      - 'scripts/run_scanner_engine_diagnostic.py'
      - 'apps/api/tests/test_scanner_engine_*.py'
      - 'docs/scanner-engine-diagnostic.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-engine-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  native-engine-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the complete exact event history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the locked Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Install the existing locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Observe the alternate binary without scanner admission authority
        run: python scripts/run_scanner_engine_diagnostic.py
      - name: Preserve only bounded nonauthoritative observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scanner-engine-diagnostic-${{ github.run_attempt }}
          path: var/scanner-engine-diagnostic/
          if-no-files-found: warn
          retention-days: 14
