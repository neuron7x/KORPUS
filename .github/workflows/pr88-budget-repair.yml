name: pr88-budget-repair

# Temporary, PR-88-only repair producer. It never updates a Git ref or merges.
# The controller removes this workflow when publishing the verified repair blobs.
on:
  pull_request:
    types: [synchronize]
    paths: [.github/workflows/pr88-budget-repair.yml]

permissions:
  contents: read

concurrency:
  group: pr88-budget-repair
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'neuron7x/KORPUS' &&
      github.event.pull_request.number == 88 &&
      github.event.pull_request.head.repo.full_name == 'neuron7x/KORPUS' &&
      github.event.pull_request.head.ref == 'research/kb-reference-metadata-gate-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      ORIGINAL_HEAD: b1ee4582f223c3022d9be9d59dd2452d755e18af
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts:${{ github.workspace }}/apps/api/src
      KORPUS_ENVIRONMENT: test
      KORPUS_SCHEMA_MODE: auto
      KORPUS_DATABASE_URL: sqlite:///${{ github.workspace }}/var/pr88-repair.db
      KORPUS_OBJECT_ROOT: ${{ github.workspace }}/var/objects
      KORPUS_AUTH_MODE: dev
      KORPUS_DEV_MODE_ACKNOWLEDGEMENT: I_ACKNOWLEDGE_DEV_AUTH_IS_INSECURE
      KORPUS_BIND_HOST: 127.0.0.1
      KORPUS_AUDIT_HMAC_KEY: ci-only-audit-key
      KORPUS_JWT_SECRET: ci-only-jwt-key
    steps:
      - name: Checkout exact repair-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse drift and isolate the original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$ORIGINAL_HEAD"
          test "$(git diff --name-only "$ORIGINAL_HEAD" "$EVENT_HEAD")" = '.github/workflows/pr88-budget-repair.yml'
          git checkout --detach "$ORIGINAL_HEAD"
          test -z "$(git status --porcelain)"
          mkdir -p var
      - name: Install exact Python and locked test environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install hash-verified dependencies
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Reproduce failure, register measured ceilings, and rebind source
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from scripts import check_module_budget as budget_gate
          from scripts.generate_manifest import build_manifest, write_manifest
          from scripts.verify_package_build_identity import verify as verify_build
          from scripts.verify_source_manifest import verify as verify_source

          root = Path.cwd()
          target = 'scripts/kb_reference_admission.py'
          budget_path = root / 'config/operations/module-budget.json'
          manifest_path = root / 'SOURCE_MANIFEST.json'
          package_path = root / 'PACKAGE_BUILD.json'
          before_text = budget_path.read_text(encoding='utf-8')
          before = json.loads(before_text)
          assert target not in before['modules'], 'Registration already exists; refuse drift'
          measurement = budget_gate.measure()
          assert sorted(set(measurement) - set(before['modules'])) == [target]
          old_manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert build_manifest(root) == old_manifest, 'Original manifest is not exact'
          assert verify_source(root)['valid'] is True
          assert verify_build(root) == []

          node = 'apps/api/tests/test_gate_parity.py::test_every_module_is_in_the_budget'
          command = [sys.executable, '-m', 'pytest', '-q', node, '-p', 'no:cacheprovider', '--tb=short']
          baseline = subprocess.run(command, capture_output=True, text=True, check=False)
          baseline_output = baseline.stdout + baseline.stderr
          (root / 'var/pr88-negative-baseline.log').write_text(baseline_output, encoding='utf-8')
          assert baseline.returncode == 1, baseline_output
          assert 'these modules have no recorded ceiling' in baseline_output
          assert target in baseline_output
          print('NEGATIVE_CONTROL missing_registration: correctly rejected by existing test')

          measured = measurement[target]
          metrics = ('lines', 'max_complexity', 'max_function_lines', 'max_function_args', 'max_nesting')
          entry = {key: measured[key] for key in (*metrics, 'proof_lines')}
          entry['reason'] = ('PR #88 initial registration of the offline metadata-only reference validator at exact measured ceilings. Existing module limits are unchanged; this grants no content or production admission.')
          assert budget_gate.module_violations(target, measured, entry) == []
          controls = ['missing_registration']
          for key in metrics:
              poisoned = dict(entry)
              poisoned[key] = measured[key] - 1
              failures = budget_gate.module_violations(target, measured, poisoned)
              assert failures, f'Lowered {key} ceiling did not reject'
              controls.append('lowered_' + key)
              print('NEGATIVE_CONTROL', key, json.dumps(failures))

          after = copy.deepcopy(before)
          after['modules'][target] = entry
          restored = copy.deepcopy(after)
          del restored['modules'][target]
          assert restored == before, 'An existing limit or history was modified'
          formats = [sort for sort in (True, False) if json.dumps(before, ensure_ascii=False, indent=2, sort_keys=sort) + '\n' == before_text]
          assert formats, 'Unrecognized budget formatting; refuse unrelated reformat'
          budget_path.write_text(json.dumps(after, ensure_ascii=False, indent=2, sort_keys=formats[0]) + '\n', encoding='utf-8')
          manifest = write_manifest(root, manifest_path, kind='source')
          assert manifest['file_count'] == old_manifest['file_count'] == 2122
          old_records = {item['path']: item for item in old_manifest['files']}
          records = {item['path']: item for item in manifest['files']}
          assert set(records) == set(old_records)
          changed_records = sorted(path for path in records if records[path] != old_records[path])
          assert changed_records == ['config/operations/module-budget.json'], changed_records
          package_text = package_path.read_text(encoding='utf-8')
          old_root = old_manifest['root_sha256']
          assert package_text.count(old_root) == 1
          package_path.write_text(package_text.replace(old_root, manifest['root_sha256']), encoding='utf-8')
          assert verify_source(root)['valid'] is True
          assert verify_build(root) == []
          paths = sorted(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert paths == ['PACKAGE_BUILD.json', 'SOURCE_MANIFEST.json', 'config/operations/module-budget.json'], paths
          receipt = {
              'schema': 'korpus.pr88-budget-repair.v1',
              'status': 'PREPARED_NOT_ADMITTED',
              'original_head': os.environ['ORIGINAL_HEAD'],
              'repair_request_head': os.environ['EVENT_HEAD'],
              'module': target,
              'measurement': measured,
              'entry': entry,
              'existing_limits_unchanged': True,
              'negative_controls_rejected': controls,
              'source_file_count': manifest['file_count'],
              'source_manifest_root_sha256': manifest['root_sha256'],
              'changed_paths': paths,
              'merge_authorized': False,
              'production_authorized': False,
          }
          (root / 'var/pr88-budget-repair.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Run unchanged budget, manifest, and focused regression gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_module_budget.py > var/pr88-module-budget.json
          python -c 'import json; r=json.load(open("var/pr88-module-budget.json")); assert r["status"]=="PASS" and not r["unbudgeted"] and not r["violations"]; print("module-budget: PASS, no unbudgeted modules or violations")'
          python scripts/check_budget_raises_are_named.py --base "$ORIGINAL_HEAD"
          python scripts/verify_source_manifest.py
          python scripts/verify_package_build_identity.py
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          tests = ['apps/api/tests/test_kb_reference_admission.py', 'apps/api/tests/test_gate_parity.py::test_every_module_is_in_the_budget']
          tests += [str(path) for path in sorted(Path('apps/api/tests').glob('test_*budget*.py'))]
          command = [sys.executable, '-m', 'pytest', '-q', *tests, '-p', 'no:cacheprovider', '--junitxml=var/pr88-repair-tests.xml']
          subprocess.run(command, check=True)
          path = Path('var/pr88-budget-repair.json')
          receipt = json.loads(path.read_text())
          receipt['verification_commands'] = [command]
          receipt['focused_tests_passed'] = True
          receipt['budget_gate_passed'] = True
          receipt['source_manifest_verified'] = True
          receipt['package_build_verified'] = True
          path.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check
          git diff --stat
          git diff -- config/operations/module-budget.json > var/pr88-budget-repair.patch
      - name: Publish verified unreferenced blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          api = 'https://api.github.com/repos/neuron7x/KORPUS'
          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(api + path, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }, method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          pr = request('/pulls/88')
          assert pr['state'] == 'open' and not pr['merged']
          assert pr['head']['sha'] == os.environ['EVENT_HEAD'], 'PR advanced; refuse stale publication'
          assert pr['head']['ref'] == 'research/kb-reference-metadata-gate-20261021'
          assert pr['base']['ref'] == 'main'
          path = Path('var/pr88-budget-repair.json')
          receipt = json.loads(path.read_text())
          assert receipt['focused_tests_passed'] and receipt['budget_gate_passed']
          assert receipt['source_manifest_verified'] and receipt['package_build_verified']
          assert receipt['changed_paths'] == ['PACKAGE_BUILD.json', 'SOURCE_MANIFEST.json', 'config/operations/module-budget.json']
          blobs = []
          for name in receipt['changed_paths']:
              data = Path(name).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              obj = request('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode('ascii')})
              assert obj['sha'] == expected, 'Published Git object differs from tested bytes'
              blobs.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': expected, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          receipt['blobs'] = blobs
          receipt['status'] = 'VERIFIED_BLOBS_NOT_ADMITTED'
          receipt['workflow_run_id'] = os.environ['GITHUB_RUN_ID']
          receipt['workflow_run_attempt'] = os.environ['GITHUB_RUN_ATTEMPT']
          text = json.dumps(receipt, indent=2) + '\n'
          path.write_text(text, encoding='utf-8')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## PR #88 repair evidence — not merge authorization\n\n```json\n' + text + '```\n')
          PY
      - name: Preserve repair evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr88-budget-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/pr88-budget-repair.json
            var/pr88-negative-baseline.log
            var/pr88-module-budget.json
            var/pr88-repair-tests.xml
            var/pr88-budget-repair.patch
          if-no-files-found: error
          retention-days: 7
