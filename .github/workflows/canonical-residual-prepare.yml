name: canonical-residual-prepare

on:
  push:
    branches: [integration/canonical-main-20261021]
    paths:
      - .github/canonical_residual_prepare.py
      - .github/canonical_staging_cases.py
      - .github/workflows/canonical-residual-prepare.yml
permissions:
  contents: read
concurrency:
  group: canonical-residual-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'neuron7x/KORPUS'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts:${{ github.workspace }}/apps/api/src
      KORPUS_ENVIRONMENT: test
      KORPUS_SCHEMA_MODE: auto
      KORPUS_DATABASE_URL: sqlite:///${{ github.workspace }}/var/residual.db
      KORPUS_OBJECT_ROOT: ${{ github.workspace }}/var/residual-objects
      KORPUS_AUTH_MODE: dev
      KORPUS_DEV_MODE_ACKNOWLEDGEMENT: I_ACKNOWLEDGE_DEV_AUTH_IS_INSECURE
      KORPUS_BIND_HOST: 127.0.0.1
      KORPUS_AUDIT_HMAC_KEY: ci-only-audit-key
      KORPUS_JWT_SECRET: ci-only-jwt-key
    steps:
      - name: Checkout exact request without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read pinned static comparison evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: residual-static-39629417088-1
          path: ${{ runner.temp }}/residual-audit
          run-id: 39629417088
          github-token: ${{ github.token }}
      - name: Read historical candidate JUnit for named-test reconciliation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: api-coverage-diagnostics-1
          path: ${{ runner.temp }}/residual-api
          run-id: 39610691741
          github-token: ${{ github.token }}
      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install hash-locked verification environment
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Execute bounded preparation with read-only repository credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/canonical_residual_prepare.py)" = 35081c980356c6d37222040a49e0b58bb9602592
          cp .github/canonical_residual_prepare.py "$RUNNER_TEMP/canonical_residual_prepare.py"
          python "$RUNNER_TEMP/canonical_residual_prepare.py"
      - name: Preserve actual tests and candidate payload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: residual-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/residual-prepared/
          if-no-files-found: error
          retention-days: 14
  publish-blobs:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Read tested data from this successful run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: residual-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/residual-prepared
      - name: Publish six verified content-addressed blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import stat
          import urllib.request
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'residual-prepared'
          receipt = json.loads((root / 'receipt.json').read_bytes())
          assert receipt['status'] == 'TESTED_NOT_ADMITTED'
          assert receipt['request_head'] == os.environ['GITHUB_SHA']
          assert receipt['run_id'] == os.environ['GITHUB_RUN_ID']
          assert receipt['source'] == 'c2abdb69edd273c53e3a7bb2344f1ffb3be2a158'
          assert receipt['main'] == '345c0f7daf1da2152d0e554cc8733381ca5a1e9e'
          assert receipt['merge_authorized'] is False and receipt['production_authorized'] is False
          assert receipt['repaired'] == {'tests': 16, 'failures': 0, 'errors': 0, 'skipped': 0}
          assert receipt['combined_focused']['failures'] == receipt['combined_focused']['errors'] == receipt['combined_focused']['skipped'] == 0
          allowed = {'Makefile', 'apps/api/tests/test_backend_report_staging.py',
                     'docs/operations/CANONICAL_CONVERGENCE.md',
                     'docs/operations/CANONICAL_BRANCH_DISPOSITION.json',
                     'SOURCE_MANIFEST.json', 'PACKAGE_BUILD.json'}
          entries = receipt['entries']
          assert len(entries) == len(allowed) and {r['path'] for r in entries} == allowed
          payload = root / 'payload'
          assert {str(p.relative_to(payload)) for p in payload.rglob('*') if p.is_file()} == allowed
          verified = []
          for row in entries:
              path = payload / row['path']
              assert not path.is_symlink() and stat.S_ISREG(path.stat().st_mode)
              assert row['mode'] == '100644' and row['type'] == 'blob'
              data = path.read_bytes()
              assert len(data) == row['bytes'] <= 2000000
              assert hashlib.sha256(data).hexdigest() == row['sha256']
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == row['sha']
              verified.append((row, data))
          assert sum(len(data) for _, data in verified) <= 5000000
          published = []
          for row, data in verified:
              request = urllib.request.Request(
                  'https://api.github.com/repos/neuron7x/KORPUS/git/blobs',
                  data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 201
                  result = json.load(response)
              assert result['sha'] == row['sha']
              published.append({'path': row['path'], 'sha': result['sha']})
          receipt['status'] = 'TESTED_BLOBS_NOT_ADMITTED'
          receipt['published_blobs'] = published
          destination = Path(os.environ['RUNNER_TEMP']) / 'residual-published'
          destination.mkdir()
          (destination / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Retain blob publication receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: residual-blobs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/residual-published/receipt.json
          if-no-files-found: error
          retention-days: 14
