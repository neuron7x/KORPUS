name: pr88-uri-grammar-repair

# Temporary PR-88-only repair producer. It publishes tested blobs, never refs.
on:
  pull_request:
    types: [synchronize]
    paths: [.github/workflows/pr88-uri-grammar-repair.yml]
permissions:
  contents: read
concurrency:
  group: pr88-uri-grammar-repair
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'neuron7x/KORPUS' &&
      github.event.pull_request.number == 88 &&
      github.event.pull_request.head.repo.full_name == 'neuron7x/KORPUS' &&
      github.event.pull_request.head.ref == 'research/kb-reference-metadata-gate-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOURCE_HEAD: b814cf6f9ddad5e5331c0995d578f88dfdfe69ad
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts:${{ github.workspace }}/apps/api/src
      KORPUS_ENVIRONMENT: test
      KORPUS_SCHEMA_MODE: auto
      KORPUS_DATABASE_URL: sqlite:///${{ github.workspace }}/var/pr88-grammar.db
      KORPUS_OBJECT_ROOT: ${{ github.workspace }}/var/objects
      KORPUS_AUTH_MODE: dev
      KORPUS_DEV_MODE_ACKNOWLEDGEMENT: I_ACKNOWLEDGE_DEV_AUTH_IS_INSECURE
      KORPUS_BIND_HOST: 127.0.0.1
      KORPUS_AUDIT_HMAC_KEY: ci-only-audit-key
      KORPUS_JWT_SECRET: ci-only-jwt-key
    steps:
      - name: Checkout immutable repair request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check source lease and isolate original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          test "$(git diff --name-only "$SOURCE_HEAD" "$EVENT_HEAD")" = '.github/workflows/pr88-uri-grammar-repair.yml'
          git checkout --detach "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"
          mkdir -p var
      - name: Install locked Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.13
          check-latest: false
      - name: Install hash-locked verification dependencies
        run: |
          python -m pip install --no-deps --require-hashes --requirement apps/api/requirements.dev.lock
          python -m pip check
      - name: Repair URI grammar with unchanged admission boundaries
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from scripts import check_module_budget as budget_gate
          from scripts.generate_manifest import build_manifest, write_manifest
          from scripts.verify_package_build_identity import verify as verify_build
          from scripts.verify_source_manifest import verify as verify_source

          root = Path.cwd()
          source = root / 'scripts/kb_reference_admission.py'
          test = root / 'apps/api/tests/test_kb_reference_uri_grammar.py'
          document = root / 'docs/research/KB_REFERENCE_STAGING.md'
          manifest_path = root / 'SOURCE_MANIFEST.json'
          package_path = root / 'PACKAGE_BUILD.json'
          budget_path = root / 'config/operations/module-budget.json'
          original = source.read_text(encoding='utf-8')
          original_shape = budget_gate.measure()['scripts/kb_reference_admission.py']
          budget_bytes = budget_path.read_bytes()
          old_manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert build_manifest(root) == old_manifest
          assert verify_source(root)['valid'] is True and verify_build(root) == []
          assert not test.exists(), 'Regression file already exists; refuse drift'
          test_source = '''"""Offline RFC 3986 path-character admission and encoding regression controls."""
          from __future__ import annotations

          import json
          import string
          from pathlib import Path

          import pytest

          from scripts import kb_reference_admission as gate

          PATH_CHARACTERS = frozenset(string.ascii_letters + string.digits + "-._~!$&'()*+,;=:@/")
          EXCLUDED = tuple(chr(code) for code in (34, 60, 62, 91, 93, 94, 96, 123, 124, 125))


          def _row(index: int, url: str) -> dict[str, object]:
              return {
                  "source_id": f"SRC_GRAMMAR_{index}",
                  "title": "Reference title",
                  "publisher": "Reference publisher",
                  "url": url,
                  "category_ids": ["T07_DATA_PROVENANCE_AND_RIGHTS"],
                  "access_model": "PUBLIC_LANDING",
                  "reuse_status": "UNASSESSED",
                  "integration_mode": "METADATA_ONLY",
              }


          @pytest.mark.parametrize("code", range(128))
          def test_every_literal_ascii_path_character(code: int) -> None:
              character = chr(code)
              actual = gate._public_https_url("https://example.org/a" + character + "b")
              assert actual is (character in PATH_CHARACTERS)


          @pytest.mark.parametrize("character", (*EXCLUDED, chr(92), "?", "#"))
          def test_encoded_excluded_characters_remain_path_data(character: str) -> None:
              encoded = f"%{ord(character):02X}"
              assert gate._public_https_url("https://example.org/a" + encoded + "b") is True


          @pytest.mark.parametrize("suffix", ["%", "%0", "%GG", "a%2g", "a%20%"])
          def test_malformed_percent_triplets_remain_rejected(suffix: str) -> None:
              assert gate._public_https_url("https://example.org/" + suffix) is False


          @pytest.mark.parametrize("character", EXCLUDED)
          def test_raw_and_encoded_spellings_cannot_both_enter_catalog(
              tmp_path: Path, character: str
          ) -> None:
              raw = "https://example.org/a" + character + "b"
              encoded = "https://example.org/a" + f"%{ord(character):02X}" + "b"
              path = tmp_path / "catalog.jsonl"
              text = "\\n".join(json.dumps(_row(index, url)) for index, url in enumerate((raw, encoded)))
              path.write_text(text + "\\n", encoding="utf-8")
              result = gate.verify_catalog(path)
              assert result["structure_status"] == "FAIL"
              assert result["source_records"] == 1
              assert any("invalid metadata-only source record" in error for error in result["errors"])
              assert result["candidate_status"] == "BLOCKED"
              assert result["acquired"] == result["indexable"] == result["rights_cleared"] == 0
              assert result["production_authorized"] is False
              assert result["network_access_performed"] is False


          @pytest.mark.parametrize("path", ["", "/", "/a:b", "/a@b", "/a!$&'()*+,;=b", "/a//b", "/a%2Fb"])
          def test_legal_path_shapes_remain_admissible(path: str) -> None:
              assert gate._public_https_url("https://example.org" + path) is True


          def test_default_catalog_retains_metadata_only_result() -> None:
              result = gate.verify_catalog()
              assert result["structure_status"] == "PASS"
              assert result["source_records"] == 18
              assert result["candidate_status"] == "BLOCKED"
              assert result["indexable"] == result["acquired"] == 0
              assert result["production_authorized"] is False
              assert result["network_access_performed"] is False
          '''
          test.write_text(test_source, encoding='utf-8')
          subprocess.run([sys.executable, '-m', 'ruff', 'format', str(test)], check=True)

          def run_tests(paths, label):
              output = root / ('var/pr88-grammar-' + label + '.xml')
              command = [sys.executable, '-m', 'pytest', '-q', *paths, '-p', 'no:cacheprovider', '--tb=short', '--junitxml=' + str(output)]
              result = subprocess.run(command, capture_output=True, text=True, check=False)
              (root / ('var/pr88-grammar-' + label + '.log')).write_text(result.stdout + result.stderr, encoding='utf-8')
              totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
              for suite in ET.parse(output).getroot().iter('testsuite'):
                  for key in totals:
                      totals[key] += int(suite.get(key, '0'))
              assert totals['errors'] == totals['skipped'] == 0, totals
              print(label, json.dumps(totals), 'exit', result.returncode)
              return result.returncode, totals

          code, baseline = run_tests([str(test)], 'baseline')
          assert code == 1 and baseline == {'tests': 164, 'failures': 20, 'errors': 0, 'skipped': 0}, baseline
          old_line = next(line for line in original.splitlines() if 're.search(r"%(?!' in line)
          new_line = '''    if re.search(r"[^A-Za-z0-9._~!$&'()*+,;=:@/%-]|%(?![0-9A-Fa-f]{2})", url):'''
          assert original.count(old_line) == 1
          repaired = original.replace(old_line, new_line)
          source.write_text(repaired, encoding='utf-8')
          after_shape = budget_gate.measure()['scripts/kb_reference_admission.py']
          for metric in ('lines', 'proof_lines', 'max_complexity', 'max_function_lines', 'max_function_args', 'max_nesting'):
              assert after_shape[metric] <= original_shape[metric], (metric, after_shape, original_shape)
          heading = '## ASCII URI character grammar'
          old_document = document.read_text(encoding='utf-8')
          assert heading not in old_document
          document.write_text(old_document + '\n\n' + heading + '\n\nThe no-query/no-fragment HTTPS policy admits only RFC 3986 path characters: unreserved characters, sub-delimiters, colon, at-sign, slash and valid percent triplets. Raw excluded ASCII characters such as brackets, quotes, braces, caret, backtick and vertical bar are refused before canonical identity comparison. Their percent-encoded spellings remain path data; the validator does not decode reserved escapes or claim remote resource equivalence. This is an offline syntax boundary, not network or reuse authorization.\n\nReference: RFC 3986 sections 2.2, 2.3 and 3.3, https://www.rfc-editor.org/rfc/rfc3986.html .\n', encoding='utf-8')
          subprocess.run(['git', 'add', '--', str(test)], check=True)
          manifest = write_manifest(root, manifest_path, kind='source')
          assert manifest['file_count'] == old_manifest['file_count'] + 1 == 2127
          before_records = {item['path']: item for item in old_manifest['files']}
          after_records = {item['path']: item for item in manifest['files']}
          assert set(after_records) - set(before_records) == {str(test.relative_to(root))}
          assert not set(before_records) - set(after_records)
          assert sorted(path for path in before_records if before_records[path] != after_records[path]) == ['docs/research/KB_REFERENCE_STAGING.md', 'scripts/kb_reference_admission.py']
          package_text = package_path.read_text(encoding='utf-8')
          assert package_text.count(old_manifest['root_sha256']) == 1
          package_path.write_text(package_text.replace(old_manifest['root_sha256'], manifest['root_sha256']), encoding='utf-8')
          assert verify_source(root)['valid'] is True and verify_build(root) == []
          paths = [str(path) for path in sorted((root / 'apps/api/tests').glob('test_kb_reference_*.py'))]
          paths.append('apps/api/tests/test_gate_parity.py::test_every_module_is_in_the_budget')
          paths += [str(path) for path in sorted((root / 'apps/api/tests').glob('test_*budget*.py'))]
          code, focused = run_tests(paths, 'focused')
          assert code == 0 and focused == {'tests': 330, 'failures': 0, 'errors': 0, 'skipped': 0}, focused
          mutations = {
              'grammar_guard_removed': repaired.replace(new_line, old_line),
              'encoded_path_data_rejected': repaired.replace(new_line, new_line.replace('if re.search', 'if "%" in url or re.search')),
              'legal_subdelimiters_rejected': repaired.replace(new_line, new_line.replace("!$&'()*+,;=", '')),
          }
          controls = {}
          try:
              for label, mutation in mutations.items():
                  assert mutation != repaired
                  source.write_text(mutation, encoding='utf-8')
                  code, counts = run_tests([str(test)], label)
                  assert code == 1 and counts['failures'] > 0, counts
                  controls[label] = counts
          finally:
              source.write_text(repaired, encoding='utf-8')
          code, restored = run_tests(paths, 'restored')
          assert code == 0 and restored == focused
          assert budget_path.read_bytes() == budget_bytes
          commands = [
              [sys.executable, '-m', 'ruff', 'check', str(source), str(test)],
              [sys.executable, '-m', 'ruff', 'format', '--check', str(source), str(test)],
              [sys.executable, '-m', 'mypy', str(source)],
              [sys.executable, 'scripts/check_module_budget.py'],
              [sys.executable, 'scripts/check_budget_raises_are_named.py', '--base', os.environ['SOURCE_HEAD']],
              [sys.executable, 'scripts/verify_source_manifest.py'],
              [sys.executable, 'scripts/verify_package_build_identity.py'],
              ['git', 'diff', '--check'],
          ]
          for command in commands:
              subprocess.run(command, check=True)
          assert verify_source(root)['valid'] is True and verify_build(root) == []
          changed = sorted(subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines())
          assert changed == ['PACKAGE_BUILD.json', 'SOURCE_MANIFEST.json', 'apps/api/tests/test_kb_reference_uri_grammar.py', 'docs/research/KB_REFERENCE_STAGING.md', 'scripts/kb_reference_admission.py'], changed
          receipt = {
              'schema': 'korpus.pr88-uri-grammar-repair.v1',
              'status': 'VERIFIED_NOT_ADMITTED',
              'original_head': os.environ['SOURCE_HEAD'],
              'repair_request_head': os.environ['EVENT_HEAD'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'baseline': baseline, 'focused': focused, 'restored': restored,
              'guard_controls': controls, 'measured_shape_before': original_shape,
              'measured_shape_after': after_shape, 'existing_budgets_unchanged': True,
              'source_file_count': manifest['file_count'],
              'source_manifest_root_sha256': manifest['root_sha256'],
              'changed_paths': changed, 'quality_commands': commands,
              'merge_authorized': False, 'production_authorized': False,
          }
          Path('var/pr88-grammar-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Publish only exact tested unreferenced blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path
          api = 'https://api.github.com/repos/neuron7x/KORPUS'
          def request(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(api + path, data=data, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }, method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          pr = request('/pulls/88')
          assert pr['state'] == 'open' and not pr['merged']
          assert pr['head']['sha'] == os.environ['EVENT_HEAD'], 'PR advanced; refuse stale publication'
          assert pr['head']['ref'] == 'research/kb-reference-metadata-gate-20261021'
          assert pr['base']['ref'] == 'main'
          path = Path('var/pr88-grammar-receipt.json')
          receipt = json.loads(path.read_text(encoding='utf-8'))
          assert receipt['status'] == 'VERIFIED_NOT_ADMITTED'
          assert receipt['focused'] == receipt['restored'] == {'tests': 330, 'failures': 0, 'errors': 0, 'skipped': 0}
          assert receipt['changed_paths'] == ['PACKAGE_BUILD.json', 'SOURCE_MANIFEST.json', 'apps/api/tests/test_kb_reference_uri_grammar.py', 'docs/research/KB_REFERENCE_STAGING.md', 'scripts/kb_reference_admission.py']
          blobs = []
          for name in receipt['changed_paths']:
              data = Path(name).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              obj = request('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode('ascii')})
              assert obj['sha'] == expected
              blobs.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': expected, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          receipt['blobs'] = blobs
          receipt['status'] = 'VERIFIED_BLOBS_NOT_ADMITTED'
          text = json.dumps(receipt, indent=2) + '\n'
          path.write_text(text, encoding='utf-8')
          print('PR88_URI_GRAMMAR_RECEIPT_BEGIN\n' + text + 'PR88_URI_GRAMMAR_RECEIPT_END')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## URI grammar repair evidence, not merge authorization\n\n```json\n' + text + '```\n')
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr88-uri-grammar-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/pr88-grammar-*.json
            var/pr88-grammar-*.xml
            var/pr88-grammar-*.log
          if-no-files-found: error
          retention-days: 14
