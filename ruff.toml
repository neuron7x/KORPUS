# One lint configuration for the whole repository.
#
# It lives at the root on purpose. With the only ruff section buried in
# apps/api/pyproject.toml, ruff resolved a *different* configuration per argument of
# the same command: files under apps/api/ picked up the project's rules, while
# scripts/ walked up the filesystem until it found whatever pyproject.toml sat above
# the checkout. On this machine that was /home/neuro7/pyproject.toml — a research
# project's config with select = ["E","F","W","I","N","UP","B","SIM"] — so
# `make api-lint` reported 163 errors locally and a different number in CI, and the
# number depended on where the repository happened to be cloned.
#
# Verified 2026-08-03: `ruff check --show-settings scripts/run_evals.py` reported
# linter.project_root = "/home/neuro7" before this file existed.
target-version = "py312"
line-length = 100

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "EXE", "PLW", "SLF", "BLE"]
# RUF001-003 flag Cyrillic letters as "ambiguous unicode". Product copy is Ukrainian
# by design, so this rule would fire on every user-facing string in the system.
# Ruff's formatter deliberately leaves long URLs, exact protocol literals and
# mutation targets intact. E501 therefore duplicates the formatter for ordinary
# code while producing false positives for values that cannot be split safely.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[lint.per-file-ignores]
# Tests reach into process-local adapters on purpose: that is the seam where real
# infrastructure is injected, and a test that went through a public setter would be
# testing a setter written for tests.
"apps/api/tests/*" = ["SLF001"]
# Historical migrations are checksum-bound deployment inputs. Import ordering is
# intentionally frozen once shipped; later migrations may not rewrite history.
"apps/api/migrations/versions/*" = ["I001"]
# The package-level version alias is a public runtime contract consumed externally.
"apps/api/src/korpus/__init__.py" = ["F401"]

# --- BLE001: four degradation boundaries, not four oversights -----------------
# Each site below turns an arbitrary failure into a *reported* degraded state and
# nothing else. Narrowing the caught type at any of them would convert a
# fail-closed answer ("not ready", "worker failed") into an escaping exception,
# which is a behaviour change, not a lint fix.

# healthcheck() probes an S3 client that is *injected* and only imported lazily
# (boto3/botocore are imported inside __init__, so botocore is not a hard
# dependency of this module). There is no exception class this module may name
# without acquiring that dependency, and any failure to prove the bucket healthy
# must read as "unhealthy" -> return False.
"apps/api/src/korpus/infrastructure/object_store.py" = ["BLE001"]

# healthcheck() probes a transport declared as a Protocol (EmbeddingHttpClient),
# satisfied by httpx.Client and by test doubles alike; httpx.HTTPError would not
# cover the conforming implementations. SLF001: this module and repository.py are
# the same infrastructure layer and share the identity/clearance mapping
# (_apply_postgres_identity, _allowed_classifications). Publishing those two would
# be publishing methods written for exactly one caller — and publishing the RLS
# identity switch widens the surface that can set a Postgres session identity.
"apps/api/src/korpus/infrastructure/semantic.py" = ["BLE001", "SLF001"]
"apps/api/src/korpus/infrastructure/embedding_backfill.py" = ["SLF001"]

# The GCS health probe is a degradation boundary over an injected transport. Any
# transport/parser/client failure means "unhealthy"; leaking an unexpected exception
# would turn readiness into a 500 and expose adapter-specific failure details.
"apps/api/src/korpus/infrastructure/gcs.py" = ["BLE001"]

# The whole module is a subprocess entry point: its contract with the parent is
# "exit 2 + one stderr line" for *any* parser failure (extraction.py checks the
# returncode). A narrower catch would emit a traceback and exit 1 instead.
"apps/api/src/korpus/infrastructure/parser_worker.py" = ["BLE001"]

# The audit-anchor reconcile loop is a supervised background task. A narrower
# catch would let one unexpected error terminate the loop for the life of the
# process; the current handler records the failure via
# observe_anchor_reconcile_failure and readiness still exposes the backlog.
"apps/api/src/korpus/main.py" = ["BLE001"]

# These modules defer imports intentionally: application modules break otherwise
# cyclic type/composition seams, while executable scripts establish their repository
# import path before loading local packages. Keep the exception narrow and explicit.
"apps/api/src/korpus/application/evidence.py" = ["E402", "I001"]
"apps/api/src/korpus/application/provenance.py" = ["E402"]
"apps/api/src/korpus/application/retrieval.py" = ["E402"]
"apps/api/src/korpus/config.py" = ["E402", "I001"]
"apps/api/src/korpus/domain/models.py" = ["E402"]
"apps/api/src/korpus/infrastructure/learning_schema.py" = ["E402"]
"apps/api/tests/test_coverage_closure_v097.py" = ["E402"]
"scripts/generate_manifest.py" = ["E402"]
"scripts/pec_ablation_cli.py" = ["E402"]
"scripts/pec_controller_export_impl.py" = ["E402"]
"scripts/pec_controller_training_impl.py" = ["E402"]
"scripts/pec_controller_verify_impl.py" = ["E402"]
"scripts/pec_oracle_impl.py" = ["E402"]
"scripts/pec_promotion_cli.py" = ["E402"]
"scripts/run_pec_metamorphic_campaign.py" = ["E402"]
"scripts/run_pec_research_program.py" = ["E402"]
"scripts/verify_gcp_production.py" = ["E402"]
"scripts/verify_package.py" = ["E402"]
"scripts/verify_source_manifest.py" = ["E402"]
"scripts/zip_safety.py" = ["E402"]

# These files contain exact source substrings exercised by the first-order
# mutation catalogue. Reformatting those substrings would silently detach the
# mutant from its production predicate, so only their legacy layout diagnostics
# are frozen; substantive diagnostics remain enabled.
"apps/api/src/korpus/api/routes_answers.py" = ["I001"]
"apps/api/src/korpus/application/mission_assurance_v2.py" = ["E701", "E702", "I001", "UP035"]
"apps/api/src/korpus/application/operational_math.py" = ["F401"]
"apps/api/src/korpus/application/pec_oracle_policy.py" = ["E741", "I001", "UP035"]
"apps/api/src/korpus/controlled_requirements.py" = ["I001"]
"apps/api/src/korpus/domain/temporal.py" = ["I001", "SIM103"]
"apps/api/src/korpus/infrastructure/review_transitions.py" = ["I001"]
"scripts/assemble_production_assurance.py" = ["E702", "EXE001"]
"scripts/manifest_lib/integrity.py" = ["I001"]
"scripts/release_attestation.py" = ["E401", "E701", "E702", "EXE001", "I001"]
"scripts/run_tevv_production_gate.py" = ["E401", "E402", "E701", "E702", "EXE001", "I001"]
"scripts/validate_external_redteam_evidence.py" = ["E401", "E701", "E702", "EXE001", "I001"]
"scripts/verify_production_assurance.py" = ["E401", "E701", "E702", "EXE001", "I001"]
"scripts/run_mutation_production_gate.py" = ["F401", "I001"]

# Same-layer orchestration adapters intentionally reuse non-public primitives;
# publishing them would widen security-sensitive state mutation surfaces.
"apps/api/src/korpus/application/answer_retrieval_gate.py" = ["SLF001"]
"apps/api/src/korpus/infrastructure/repository_search.py" = ["SLF001"]

# These command-line probes are fail-closed reporting boundaries: every adapter,
# parser or transport exception becomes a negative result rather than a traceback.
"scripts/gcp/verify_governance_bundle.py" = ["BLE001"]
"scripts/inference_smoke.py" = ["BLE001"]
"scripts/pec_replay_run.py" = ["BLE001"]
