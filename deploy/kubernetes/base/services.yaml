apiVersion: v1
kind: Service
metadata: {name: korpus-api, namespace: korpus}
spec:
  selector: {app.kubernetes.io/name: korpus-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: korpus-authorization-broker, namespace: korpus}
spec:
  selector: {app.kubernetes.io/name: korpus-authorization-broker}
  ports: [{name: https, port: 8443, targetPort: https}]
---
apiVersion: v1
kind: Service
metadata: {name: korpus-web, namespace: korpus}
spec:
  selector: {app.kubernetes.io/name: korpus-web}
  ports: [{name: http, port: 8080, targetPort: http}]
