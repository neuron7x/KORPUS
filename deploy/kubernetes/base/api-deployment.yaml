apiVersion: apps/v1
kind: Deployment
metadata:
  name: korpus-api
  namespace: korpus
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: korpus-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: korpus-api, app.kubernetes.io/part-of: korpus}
    spec:
      serviceAccountName: korpus-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: registry.invalid/korpus/api@sha256:REPLACE_WITH_VERIFIED_DIGEST
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: korpus-config}
            - secretRef: {name: korpus-runtime-secrets}
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: http}
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: {cpu: 500m, memory: 768Mi, ephemeral-storage: 512Mi}
            limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: governance, mountPath: /etc/korpus/governance, readOnly: true}
      volumes:
        - name: governance
          secret:
            secretName: korpus-governance-bundle
            defaultMode: 0400
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
