apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: korpus-api, namespace: korpus}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: korpus-api}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: korpus-web, namespace: korpus}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: korpus-web}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: korpus-api, namespace: korpus}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: korpus-api}
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
    scaleUp: {stabilizationWindowSeconds: 30}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: korpus-worker, namespace: korpus}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: korpus-worker}
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown: {stabilizationWindowSeconds: 600}
    scaleUp: {stabilizationWindowSeconds: 30}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
