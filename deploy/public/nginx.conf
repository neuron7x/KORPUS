# The public edge. A different deployment from apps/web/nginx.conf, and named separately
# on purpose: this one authenticates on the visitor's behalf, and shipping it into a
# controlled environment by accident would make that environment anonymous.
#
# Three differences from the controlled edge, each deliberate:
#
#   1. `proxy_set_header Authorization` injects a read-only identity. The page carries no
#      token, so nothing to leak from a browser and nothing for a visitor to manage. The
#      identity is `public`: roles [user], clearance public, corpus public. It cannot
#      ingest, review, approve or read the audit chain — the API refuses on the role, not
#      on the interface hiding a button.
#   2. The operator consoles are not served. The API would refuse every action they offer,
#      but a write surface reachable anonymously is a surface, and the honest thing is to
#      not publish it.
#   3. Rate limits are tighter. A public URL gets crawled.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 20s;
  keepalive_requests 200;
  reset_timedout_connection on;
  server_tokens off;
  # Behind the tunnel every visitor arrives from 127.0.0.1, so `$binary_remote_addr`
  # was one bucket for the whole internet: measured 2026-08-06, a four-worker soak got
  # 2 967 requests refused and 144 served, and a spike got 34 898 of 34 977. The limit
  # was not protecting the API — the API serves four concurrent questions in under a
  # second — it was refusing everybody on behalf of everybody.
  #
  # `real_ip` from the loopback the tunnel connects on, so the zone is keyed on the
  # visitor. Stated plainly: this makes the limit *fair*, not *secure*. The header is
  # written by the tunnel provider and anyone who could reach nginx directly could set
  # it; nginx listens on loopback only and the alternative — one shared bucket — is
  # worse in every case that matters.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Per visitor: enough for a person reading and asking follow-ups, not enough for one
  # client to occupy the box.
  limit_req_zone $binary_remote_addr zone=korpus_public_rate:10m rate=3r/s;
  limit_conn_zone $binary_remote_addr zone=korpus_public_conn:10m;

  # And an admission budget for everyone together, because per-visitor fairness says
  # nothing about fifty visitors. Set to what this machine was measured serving with
  # its answers still under a second, not to a number that sounds generous.
  limit_req_zone $server_name zone=korpus_public_total:1m rate=12r/s;
  limit_conn_zone $server_name zone=korpus_public_total_conn:1m;
  limit_req_status 429;
  limit_conn_status 429;
  client_max_body_size 1m;
  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  server {
    # Адреса вписана НАВМИСНО, і без неї цей файл заперечував сам себе. Контейнер
    # запускається з `--network host`, тож `listen 8081;` без адреси означало 0.0.0.0:
    # виміряно 31.08.2026 — edge відповідав 200 з 192.168.0.101 (LAN), 100.75.207.68
    # (tailnet) і з 172.17.0.1/172.18.0.1, тобто з КОЖНОГО контейнера на docker-мостах.
    # Тунель переставав бути єдиними дверима, а весь аргумент про `real_ip` вище
    # тримається саме на «nginx listens on loopback only». Твердження й правило тепер
    # збігаються: тунель приходить на 127.0.0.1, більше сюди не приходить ніхто.
    listen 127.0.0.1:8081;
    server_name _;
    root /usr/share/nginx/html;

    # Keep edge admission failures on the same typed error contract as the API. HTML
    # here made clients classify an intentional 429 as a malformed upstream response.
    error_page 429 = @rate_limited;

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 2 always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      add_header Cache-Control "no-store" always;
      return 429 '{"detail":{"reason":"edge_rate_limited","detail":"Публічний шлюз тимчасово обмежив частоту запитів. Повторіть через 2 секунди."}}';
    }

    # nginx `add_header` REPLACES the inherited set, so the block is repeated in every
    # location that adds one of its own. Measured on the controlled edge 2026-08-06:
    # a single Cache-Control in one location served every page without a CSP.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # Not published. Every action behind it is refused by the API for this identity;
    # serving the page anyway would invite the attempt and teach a visitor that the
    # system is broken rather than that they are not entitled.
    #
    # Правило було `location = /console.html` — одне ім'я файла проти твердження про
    # ПОВЕРХНЮ. Виміряно 31.08.2026: сторінка 404, а `console.css`, `console_accounts.js`,
    # `console_mutations.js`, `console_readonly.js` віддавалися по 200 із справжнім
    # вмістом; `console.js` і `console_rules.js` віддавали 200 із HTML índex'а через
    # `try_files`. Тобто відвідувач діставав і саму поверхню, і хибний сигнал, що вона є.
    # `^~` навмисно: префікс, який виграє в регулярних правил і покриває будь-який
    # НОВИЙ файл консолі, а не той перелік, який ми пам'ятали в день написання.
    location ^~ /console {
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Content-Security-Policy "default-src 'self'" always;
      return 404;
    }

    # Записові маршрути не доходять до застосунку взагалі.
    #
    # Застосунок відмовляє на ролі — це виміряно й лишається другим рубежем: `user`
    # має лише answer:read і document:list, тож ingest, рецензія й скасування чинності
    # повертають 403. Але для завантаження ця відмова настає ЗАПІЗНО: FastAPI читає
    # тіло ДО того, як виконати залежності, тож 31.08.2026 анонімний запит на
    # `/v1/documents/ingest` із коректним multipart діставав 422 від валідації
    # `DocumentCreate` — тобто файл уже був прочитаний і покладений на диск. Межа —
    # єдине місце, де це можна спинити, бо будь-яка перевірка всередині застосунку
    # вже стоїть після читання тіла.
    #
    # Перелік — рівно ті маршрути, яких читацька сторінка не викликає ЖОДНОГО разу
    # (звірено закриттям `index.html`) і яких публічна особа не може мати ніколи.
    # `/v1/audit/*` тут НЕМАЄ навмисно: панель трасування читача їх кличе, і чесна
    # відповідь на цей виклик — 403 від ролі, а не 404 від межі.
    location ~ ^/api/v1/(?:admin/|ingestion-jobs|documents/ingest|documents/[^/]+/(?:versions/ingest|ingestion-jobs)|document-versions/[^/]+/(?:review|rescission)) {
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Content-Security-Policy "default-src 'self'" always;
      return 404;
    }

    location /api/ {
      limit_req zone=korpus_public_rate burst=10 nodelay;
      limit_req zone=korpus_public_total burst=24;
      limit_conn korpus_public_conn 8;
      limit_conn korpus_public_total_conn 48;
      # add_header is non-inheriting once this location declares Retry-After, so repeat
      # the browser security set here rather than silently dropping it on API responses.
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
      # Without this a refusal says only "no". A reader who is told when to come back
      # waits; one who is not, reloads, which is the behaviour the limit exists against.
      add_header Retry-After 2 always;

      # The visitor never holds this. It is minted server-side, injected here, and
      # rotated by reloading the edge — a browser cannot leak what it was never given.
      proxy_set_header Authorization "Bearer ${KORPUS_PUBLIC_TOKEN}";

      proxy_pass http://api:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_buffering off;
      proxy_max_temp_file_size 16m;
      proxy_hide_header Server;
    }

    location = /index.html {
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
      add_header Cache-Control "no-store" always;
    }
    location = /config.js {
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
      add_header Cache-Control "no-store" always;
    }
    location = /sw.js {
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
      add_header Cache-Control "no-cache" always;
    }
    # Відсутній ресурс мусить казати «нема», а не віддавати сторінку під його ім'ям.
    # `try_files ... /index.html` нижче — правило для НАВІГАЦІЇ: адресу /chat браузер
    # відкриває, і роутер сам розбереться. Але той самий фолбек віддавав 15 820 байтів
    # HTML на запит `/console.js` із кодом 200 і типом text/html — і це гірше за 404
    # у двох напрямках одразу: браузер отримує модуль, який не є модулем, а перевірка
    # «чи закрито консоль» бачить 200 і не може відрізнити витік від підміни.
    location ~* \.(?:js|mjs|css|map|json|webmanifest|png|svg|ico|woff2?)$ {
      try_files $uri =404;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
      add_header Cache-Control "public, max-age=300" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
      add_header Cache-Control "public, max-age=300" always;
    }
  }
}
