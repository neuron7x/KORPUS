stages:
  - validate
  - test
  - security
  - build
  - package

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  KORPUS_ENVIRONMENT: "test"
  KORPUS_DATABASE_URL: "sqlite:///$CI_PROJECT_DIR/var/ci.db"
  KORPUS_OBJECT_ROOT: "$CI_PROJECT_DIR/var/objects"
  KORPUS_AUTH_MODE: "dev"
  KORPUS_AUDIT_HMAC_KEY: "ci-only-audit-key"
  KORPUS_JWT_SECRET: "ci-only-jwt-key"

cache:
  paths:
    - .cache/pip
    - apps/web/node_modules

repository:validate:
  stage: validate
  image: python:3.12-slim
  script:
    - python scripts/validate_repository.py

api:test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -e 'apps/api[dev]'
  script:
    - mkdir -p var/objects
    - pytest apps/api/tests --cov=apps/api/src/korpus --cov-report=xml --cov-fail-under=85
    - PYTHONPATH=apps/api/src python scripts/run_evals.py
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - var/eval-report.json

api:quality:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -e 'apps/api[dev]'
  script:
    - ruff check apps/api/src apps/api/tests scripts
    - mypy apps/api/src

web:test:
  stage: test
  image: node:22-alpine
  script:
    - npm --prefix apps/web ci
    - npm --prefix apps/web run lint
    - npm --prefix apps/web run typecheck
    - npm --prefix apps/web run build

secret:scan:
  stage: security
  image: zricethezav/gitleaks:v8.28.0
  script:
    - gitleaks detect --source . --no-banner --redact

python:audit:
  stage: security
  image: python:3.12-slim
  before_script:
    - pip install pip-audit
  script:
    - pip-audit -r apps/api/requirements.lock || test "$ALLOW_VULNERABLE_DEPENDENCIES" = "true"

sbom:
  stage: security
  image: anchore/syft:v1.29.0
  script:
    - syft dir:. -o cyclonedx-json=sbom.cdx.json
  artifacts:
    paths: [sbom.cdx.json]

container:build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: '$CI_COMMIT_BRANCH'
  script:
    - docker build --pull -f apps/api/Dockerfile -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" .
    - docker build --pull -f apps/web/Dockerfile -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" .

source:package:
  stage: package
  image: alpine:3.21
  script:
    - apk add --no-cache bash git zip
    - bash scripts/package_repository.sh
  artifacts:
    paths: [dist/]
    expire_in: 30 days
