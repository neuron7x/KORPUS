stages:
  - validate
  - test
  - assurance
  - security
  - build
  - package

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  KORPUS_ENVIRONMENT: "test"
  KORPUS_SCHEMA_MODE: "auto"
  KORPUS_DATABASE_URL: "sqlite:///$CI_PROJECT_DIR/var/ci.db"
  KORPUS_OBJECT_ROOT: "$CI_PROJECT_DIR/var/objects"
  KORPUS_AUTH_MODE: "dev"
  KORPUS_AUDIT_HMAC_KEY: "ci-only-audit-key"
  KORPUS_JWT_SECRET: "ci-only-jwt-key"

cache:
  paths:
    - .cache/pip
    - apps/web/node_modules

repository:validate:
  stage: validate
  image: python:3.12-slim
  script:
    - python scripts/validate_repository.py
    - python -m compileall -q apps/api/src scripts

api:test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -e 'apps/api[dev]'
  script:
    - mkdir -p var/objects
    - pytest apps/api/tests --cov=apps/api/src/korpus --cov-branch --cov-report=xml:var/coverage.xml --cov-fail-under=82 --junitxml=var/pytest.xml
  artifacts:
    when: always
    reports:
      junit: var/pytest.xml
      coverage_report:
        coverage_format: cobertura
        path: var/coverage.xml
    paths:
      - var/pytest.xml
      - var/coverage.xml

api:quality:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -e 'apps/api[dev]'
  script:
    - ruff check apps/api/src apps/api/tests scripts
    - mypy apps/api/src

web:test:
  stage: test
  image: node:22-alpine
  script:
    - npm --prefix apps/web ci
    - npm --prefix apps/web run lint
    - npm --prefix apps/web run typecheck
    - npm --prefix apps/web run build

api:assurance:
  stage: assurance
  image: python:3.12-slim
  before_script:
    - pip install -e 'apps/api[dev]'
  script:
    - mkdir -p var/objects
    - PYTHONPATH=apps/api/src python scripts/run_evals.py
    - PYTHONPATH=apps/api/src python scripts/run_mutation_tests.py
    - PYTHONPATH=apps/api/src python scripts/run_migration_gate.py
    - PYTHONPATH=apps/api/src python scripts/run_scale_probe.py
  artifacts:
    when: always
    paths:
      - var/eval-report.json
      - var/mutation-report.json
      - var/migration-report.json
      - var/scale-report.json

api:postgres:
  stage: assurance
  image: python:3.12-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: korpus_test
    POSTGRES_USER: korpus
    POSTGRES_PASSWORD: korpus-test-password
    KORPUS_POSTGRES_TEST_URL: postgresql+psycopg://korpus:korpus-test-password@postgres:5432/korpus_test
    KORPUS_DATABASE_URL: postgresql+psycopg://korpus:korpus-test-password@postgres:5432/korpus_test
  before_script:
    - pip install -e 'apps/api[dev,postgres]'
    - python scripts/wait_for_database.py
  script:
    - cd apps/api && alembic upgrade head && cd ../..
    - pytest -q apps/api/tests/test_postgres_integration.py -m postgres

secret:scan:
  stage: security
  image: zricethezav/gitleaks:v8.28.0
  script:
    - gitleaks detect --source . --no-banner --redact

python:audit:
  stage: security
  image: python:3.12-slim
  before_script:
    - pip install pip-audit
  script:
    - pip-audit -r apps/api/requirements.lock

sbom:
  stage: security
  image: anchore/syft:v1.29.0
  script:
    - syft dir:. -o cyclonedx-json=sbom.cdx.json
  artifacts:
    paths: [sbom.cdx.json]

container:build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
  script:
    - docker build --pull -f apps/api/Dockerfile -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" .
    - docker build --pull -f apps/web/Dockerfile -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" .

source:package:
  stage: package
  image: alpine:3.21
  needs:
    - job: api:test
      artifacts: true
    - job: api:assurance
      artifacts: true
    - job: api:quality
    - job: api:postgres
    - job: web:test
    - job: secret:scan
    - job: python:audit
    - job: sbom
      artifacts: true
    - job: container:build
  script:
    - apk add --no-cache bash git zip python3
    - python3 scripts/snapshot_assurance.py
    - python3 scripts/generate_manifest.py
    - bash scripts/package_repository.sh
  artifacts:
    paths:
      - dist/
      - reports/
      - REPOSITORY_MANIFEST.json
      - sbom.cdx.json
    expire_in: 30 days
