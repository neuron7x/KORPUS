workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

default:
  interruptible: true
  timeout: 30m
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - validate
  - test
  - assurance
  - security
  - build
  - verify-image
  - package

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "$CI_PROJECT_DIR/apps/api/src"
  KORPUS_ENVIRONMENT: "test"
  KORPUS_SCHEMA_MODE: "auto"
  KORPUS_DATABASE_URL: "sqlite:///$CI_PROJECT_DIR/var/ci.db"
  KORPUS_OBJECT_ROOT: "$CI_PROJECT_DIR/var/objects"
  KORPUS_AUTH_MODE: "dev"
  KORPUS_AUDIT_HMAC_KEY: "ci-only-audit-key"
  KORPUS_JWT_SECRET: "ci-only-jwt-key"

.python-job:
  image: python:3.12.13-slim-bookworm
  before_script:
    - python -m pip install --no-deps --requirement apps/api/requirements.dev.lock
    - python -m pip check

repository:validate:
  stage: validate
  image: python:3.12.13-slim-bookworm
  before_script:
    - python -m pip install 'PyYAML==6.0.3'
  script:
    - python scripts/validate_repository.py
    - python scripts/validate_infrastructure.py
    - python -m compileall -q apps/api/src apps/api/migrations scripts
  artifacts:
    when: always
    paths:
      - var/infrastructure-validation.json

api:test:
  extends: .python-job
  stage: test
  script:
    - mkdir -p var/objects
    - pytest apps/api/tests --cov=apps/api/src/korpus --cov-branch --cov-report=xml:var/coverage.xml --cov-fail-under=82 --junitxml=var/pytest.xml
  artifacts:
    when: always
    reports:
      junit: var/pytest.xml
      coverage_report:
        coverage_format: cobertura
        path: var/coverage.xml
    paths:
      - var/pytest.xml
      - var/coverage.xml

api:quality:
  extends: .python-job
  stage: test
  script:
    - ruff check apps/api/src apps/api/tests apps/api/migrations scripts
    - mypy apps/api/src

web:test:
  stage: test
  image: node:22.16.0-alpine
  script:
    - npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund
    - npm --prefix apps/web run lint
    - npm --prefix apps/web run typecheck
    - npm --prefix apps/web run build

api:assurance:
  extends: .python-job
  stage: assurance
  timeout: 45m
  script:
    - mkdir -p var/objects
    - python scripts/run_evals.py
    - python scripts/run_mutation_tests.py --shard-index 0 --shard-count 3
    - python scripts/run_mutation_tests.py --shard-index 1 --shard-count 3
    - python scripts/run_mutation_tests.py --shard-index 2 --shard-count 3
    - python scripts/run_mutation_tests.py --merge --shard-count 3
    - python scripts/run_migration_gate.py
    - python scripts/run_scale_probe.py
    - python scripts/run_operational_gate.py
  artifacts:
    when: always
    paths:
      - var/eval-report.json
      - var/mutation-report.json
      - var/migration-report.json
      - var/scale-report.json
      - var/operational-gate.json

api:postgres-and-restore:
  stage: assurance
  image:
    name: pgvector/pgvector:0.8.5-pg17-trixie
    entrypoint: [""]
  services:
    - name: pgvector/pgvector:0.8.5-pg17-trixie
      alias: postgres
  variables:
    POSTGRES_DB: korpus_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres-test-password
    KORPUS_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres-test-password@postgres:5432/korpus_test
    KORPUS_POSTGRES_APP_ROLE: korpus_app
    KORPUS_POSTGRES_APP_PASSWORD: korpus-app-test-password
    KORPUS_POSTGRES_TEST_URL: postgresql+psycopg://korpus_app:korpus-app-test-password@postgres:5432/korpus_test
    KORPUS_DATABASE_URL: postgresql+psycopg://postgres:postgres-test-password@postgres:5432/korpus_test
    KORPUS_BACKUP_DATABASE_URL: postgresql://postgres:postgres-test-password@postgres:5432/korpus_test
    KORPUS_BACKUP_DIR: "$CI_PROJECT_DIR/var/backups"
    KORPUS_BACKUP_ENCRYPTION_KEY_FILE: "$CI_PROJECT_DIR/var/backup-encryption.key"
    KORPUS_BACKUP_KEY_ID: "ci-ephemeral-v4"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv ca-certificates && rm -rf /var/lib/apt/lists/*
    - python3 -m venv /tmp/korpus-venv
    - /tmp/korpus-venv/bin/pip install --no-deps --requirement apps/api/requirements.dev.lock
    - export PATH="/tmp/korpus-venv/bin:$PATH"
    - python scripts/wait_for_database.py
  script:
    - export PATH="/tmp/korpus-venv/bin:$PATH"
    - cd apps/api && python -m alembic -c alembic.ini upgrade head && python -m alembic -c alembic.ini downgrade 0002_database_defense_and_vectors && python -m alembic -c alembic.ini upgrade head && cd ../..
    - python scripts/prepare_postgres_role.py
    - pytest -q apps/api/tests/test_postgres_integration.py -m postgres
    - python -c "import secrets, pathlib; pathlib.Path('var/backup-encryption.key').write_text(secrets.token_hex(32))"
    - chmod 600 var/backup-encryption.key
    - backup_path="$(scripts/backup_postgres.sh)"
    - psql 'postgresql://postgres:postgres-test-password@postgres:5432/postgres' -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS korpus_restore' -c 'CREATE DATABASE korpus_restore'
    - export KORPUS_RESTORE_DATABASE_URL='postgresql://postgres:postgres-test-password@postgres:5432/korpus_restore'
    - scripts/restore_postgres.sh "$backup_path"
    - export KORPUS_DATABASE_URL='postgresql+psycopg://postgres:postgres-test-password@postgres:5432/korpus_restore'
    - python scripts/prepare_postgres_role.py
    - export KORPUS_POSTGRES_TEST_URL='postgresql+psycopg://korpus_app:korpus-app-test-password@postgres:5432/korpus_restore'
    - python scripts/verify_postgres_restore.py
  artifacts:
    when: always
    paths:
      - var/backups/*.json

secret:scan:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-banner --redact --exit-code 1

python:audit:
  stage: security
  image: python:3.12.13-slim-bookworm
  before_script:
    - python -m pip install 'pip-audit==2.10.1'
  script:
    - pip-audit --strict --disable-pip -r apps/api/requirements.runtime.lock

infrastructure:scan:
  stage: security
  image:
    name: aquasec/trivy:0.70.0
    entrypoint: [""]
  script:
    - trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore .

source:sbom:
  stage: security
  image:
    name: anchore/syft:v1.44.0
    entrypoint: [""]
  script:
    - syft dir:. -o cyclonedx-json=source-sbom.cdx.json
  artifacts:
    paths: [source-sbom.cdx.json]

container:build:
  stage: build
  image:
    name: moby/buildkit:v0.30.0-rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  script:
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --opt filename=apps/api/Dockerfile --output type=oci,dest=api-image.tar
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --opt filename=apps/web/Dockerfile --output type=oci,dest=web-image.tar
  artifacts:
    paths:
      - api-image.tar
      - web-image.tar
    expire_in: 1 day

container:scan:
  stage: verify-image
  image:
    name: aquasec/trivy:0.70.0
    entrypoint: [""]
  needs:
    - job: container:build
      artifacts: true
  script:
    - trivy image --input api-image.tar --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
    - trivy image --input web-image.tar --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed

container:sbom:
  stage: verify-image
  image:
    name: anchore/syft:v1.44.0
    entrypoint: [""]
  needs:
    - job: container:build
      artifacts: true
  script:
    - syft oci-archive:api-image.tar -o cyclonedx-json=api-sbom.cdx.json
    - syft oci-archive:web-image.tar -o cyclonedx-json=web-sbom.cdx.json
  artifacts:
    paths:
      - api-sbom.cdx.json
      - web-sbom.cdx.json

source:package:
  stage: package
  image: alpine:3.22.1
  needs:
    - job: repository:validate
      artifacts: true
    - job: api:test
      artifacts: true
    - job: api:assurance
      artifacts: true
    - job: api:quality
    - job: api:postgres-and-restore
      artifacts: true
    - job: web:test
    - job: secret:scan
    - job: python:audit
    - job: infrastructure:scan
    - job: source:sbom
      artifacts: true
    - job: container:scan
    - job: container:sbom
      artifacts: true
  script:
    - apk add --no-cache bash git zip python3 py3-yaml
    - PYTHONPATH=scripts python3 scripts/assemble_assurance.py
    - python3 scripts/snapshot_assurance.py
    - bash scripts/package_repository.sh
  artifacts:
    paths:
      - dist/
      - reports/
      - REPOSITORY_MANIFEST.json
      - '*-sbom.cdx.json'
    expire_in: 30 days
