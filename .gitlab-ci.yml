# Публічний веб-інтерфейс КОРПУСа.
#
# Тут лежить ЛИШЕ зібраний фронтенд — жодного джерела, жодних доказів, жодного корпусу.
# Операторську поверхню (консоль і її модулі) прибрано ТИМ САМИМ виводом
# `scripts/public_operator_surface.py`, яким її прибирає публічна межа: один вивід, один
# виконавець. Другий перелік розійшовся б із першим мовчки.
#
# Раннер груповий і власний, тож щомісячна квота спільних раннерів тут ні до чого.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - test -f public/index.html
    - test ! -e public/console.html   # операторська поверхня не публікується
    - grep -q 'publicMode: true' public/config.js
    - echo "файлів до публікації: $(find public -type f | wc -l)"
  artifacts:
    paths: [public]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
