# Публічний веб-інтерфейс КОРПУСа.
#
# Тут лежить ЛИШЕ зібраний фронтенд — жодного джерела, жодного корпусу, жодних доказів.
# Операторську поверхню прибрано ВИВОДОМ scripts/public_operator_surface.py, тим самим,
# яким її прибирає публічна межа: один вивід, один виконавець.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - "test -f public/index.html"
    - "if [ -e public/console.html ]; then echo 'операторська поверхня у збірці'; exit 1; fi"
    - "grep -q 'publicMode: true' public/config.js"
    # `_redirects` ПОХІДНЕ від routes.js, а не другий перелік маршрутів.
    #
    # Перша версія мала одне правило `/* /index.html 200`, і воно ловило ВСЕ — зокрема
    # `/console.html`, якого тут немає навмисно. Сторінка віддавала читацький index.html
    # із кодом 200 там, де відповідь мусить бути 404: операторська поверхня не витікала,
    # але СИГНАЛ був хибний, а перевірка в цьому ж джобі дивилась на відсутність ФАЙЛА
    # і тому мовчала. Перевірка, що охороняє файл, поки світ бачить відповідь, — це
    # рівно «гейт читає повз те, що охороняє».
    - "grep -oE '\"/[a-z-]*\"' public/routes.js | tr -d '\"' | sort -u > /tmp/routes"
    - "test -s /tmp/routes"
    - "printf '# Згенеровано з routes.js: один перелік маршрутів, не два.\\n' > public/_redirects"
    - "while read -r r; do [ \"$r\" = '/' ] && continue; printf '%s /index.html 200\\n' \"$r\" >> public/_redirects; done < /tmp/routes"
    - "cat public/_redirects"
    # Негативний контроль: жодне правило не сміє покривати операторський шлях.
    - "if grep -qE '^/console|^/\\* ' public/_redirects; then echo 'правило покриває операторський шлях'; exit 1; fi"
    - "test -f public/404.html"
    - "find public -type f | wc -l"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
