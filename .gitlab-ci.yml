# Публічний веб-інтерфейс КОРПУСа.
#
# Тут лежить ЛИШЕ зібраний фронтенд — жодного джерела, жодного корпусу, жодних доказів.
# Операторську поверхню прибрано ВИВОДОМ scripts/public_operator_surface.py, тим самим,
# яким її прибирає публічна межа: один вивід, один виконавець. Другий перелік розійшовся
# б із першим мовчки, і саме так консоль одного разу вже поїхала у трьох виконавцях.
#
# Перевірки в джобі — не церемонія: вони падають, якщо операторський файл повернувся в
# збірку або якщо публічний режим не увімкнено.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - "test -f public/index.html"
    - "if [ -e public/console.html ]; then echo 'операторська поверхня у збірці'; exit 1; fi"
    - "grep -q 'publicMode: true' public/config.js"
    - "find public -type f | wc -l"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
