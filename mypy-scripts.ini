# Type checking for scripts/, which apps/api/pyproject.toml does not cover.
#
# That file sets `packages = ["korpus"]`, so `make api-lint` type-checked the application
# and nothing else. Every runner, gate and generator under scripts/ — the code that decides
# whether a release is admissible — was unchecked. The first run of this configuration
# found 198 errors in 58 files.
#
# It is a separate file for the same reason ruff.toml is: with the only mypy section inside
# apps/api/pyproject.toml, running mypy on scripts/ resolves whatever configuration sits
# above the checkout, and the result depends on where the repository was cloned.
#
# `mypy_path` carries apps/api/src and nothing else. Adding scripts/ to it makes mypy see
# every file there under two module names (gcp.x and scripts.gcp.x) and refuse to start.
# Without apps/api/src mypy cannot find korpus at all,
# `ignore_missing_imports` turns every application predicate into Any, and a TypeIs that
# should narrow `object` to `int | float` silently narrows nothing — the errors then look
# like the scripts' fault.
[mypy]
python_version = 3.12
# The same pydantic plugin apps/api/pyproject.toml loads. Without it model_dump() is an
# untyped dict and every **spread of a pydantic model reports as a type error in the
# application, not in the script under test — 6 phantom errors in ingestion.py alone.
plugins = pydantic.mypy
mypy_path = apps/api/src
explicit_package_bases = True
namespace_packages = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_equality = True
ignore_missing_imports = True

[mypy-pypdf.*]
ignore_missing_imports = True
