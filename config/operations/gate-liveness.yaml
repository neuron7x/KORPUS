- name: derived-source-links
  run:
  - sh
  - -c
  - '''{python}'' scripts/build_liveness_fixture.py
    >/dev/null && ''{python}'' scripts/validate_derived_source_links.py
    --database var/liveness-fixture/korpus.db --object-root var/liveness-fixture/objects --out /dev/null'
  timeout: 300
  ignore:
  - var
  - htmlcov
  - node_modules
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  poisons:
  - name: назване джерело більше не містить цієї статті
    kind: replace
    target: evals/fixtures/liveness/sources/statute.txt
    find: охороняти пост
    payload: ЗМІНЕНО
  - name: похідна стаття взагалі не з цього корпусу
    kind: replace
    target: evals/fixtures/liveness/sources/derived.txt
    find: Вивідний зобов'язаний
    payload: Командир накладає стягнення на порушника, і цього тексту немає в жодному статуті, тому підтвердити
      посилання нічим. Вивідний зобов'язаний
  - name: рівно той самий текст, інший кінцевий пробіл
    kind: append
    target: evals/fixtures/liveness/sources/statute.txt
    payload: '

      '
    equivalent: true
- name: span-hygiene
  run:
  - sh
  - -c
  - '''{python}'' scripts/build_liveness_fixture.py
    >/dev/null && ''{python}'' scripts/validate_span_hygiene.py
    --database var/liveness-fixture/korpus.db'
  timeout: 300
  ignore:
  - var
  - htmlcov
  - node_modules
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
