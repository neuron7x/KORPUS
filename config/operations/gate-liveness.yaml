  - name: сміття веб-сторінки потрапило в доказ
    kind: append
    target: evals/fixtures/liveness/sources/statute.txt
    payload: ' We use cookies to understand additional site usage.'
  - name: розмітка, що втекла з витягу
    kind: append
    target: evals/fixtures/liveness/sources/statute.txt
