gates:
- name: doctrine-catalog
  run:
  - env
  - PYTHONPATH=apps/api/src
  - /home/neuro7/Desktop/Ядро основний проект Корпус/apps/api/.venv/bin/python
  - scripts/validate_doctrine_catalog.py
  timeout: 600
  ignore:
  - var
  - htmlcov
  - node_modules
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  poisons:
  - name: джерело на probeable-хості без жодного доказу
    kind: replace
    target: config/corpus/doctrine_catalog_2026.json
    find: '"sources": ['
    payload: '"sources": [{"id": "PROBE-NOEVIDENCE", "tier": "probe", "canonical_title": "проба", "issuer":
      "проба", "jurisdiction": "UA", "document_type": "probe", "authority": "official_ua", "access_tier":
      0, "classification": "public", "source_uri": "https://zakon.rada.gov.ua/laws/show/000-00", "source_kind":
      "official", "provenance_status": "verified", "requires_second_source": false, "rights_status": "open",
      "ingestible": true, "notes": "проба"},'
  - name: захоплений файл видалено з дерева, якір лишився
    kind: delete
    target: config/corpus/captures/ADV-CPD-REPORTS-2026.txt
  - name: каталог зник — гейт мусить впасти, а не звітувати про порожнечу
    kind: delete
    target: config/corpus/doctrine_catalog_2026.json
  - name: джерел немає — ключ перейменовано
    kind: replace
    target: config/corpus/doctrine_catalog_2026.json
    find: '"sources": ['
    payload: '"sources_disabled": ['
- name: content-signals
  run:
  - /home/neuro7/Desktop/Ядро основний проект Корпус/apps/api/.venv/bin/python
  - scripts/validate_content_signals.py
  timeout: 600
  ignore:
  - var
  - htmlcov
  - node_modules
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  poisons:
  - name: оператор застеріг вміст проти нас, а джерело лишилось ingestible
    kind: replace
    target: config/corpus/doctrine_catalog_2026.json
    find: '"sources": ['
    payload: '"sources": [{"id": "PROBE-RESERVED", "ingestible": true, "source_uri": "https://probe.example/x",
      "content_signal": {"verdict": "reserved_against_us", "read_on": "2026-08-30", "against_us": []}},'
  - name: вимір сигналу застарілий на роки
    kind: replace
    target: config/corpus/doctrine_catalog_2026.json
    find: '"sources": ['
    payload: '"sources": [{"id": "PROBE-STALE", "ingestible": true, "source_uri": "https://probe.example/x",
      "content_signal": {"verdict": "no_restriction", "read_on": "2019-01-01", "against_us": []}},'
  - name: сам запис несе заборону проти нас, а вердикт каже «без обмежень»
    kind: replace
    target: config/corpus/doctrine_catalog_2026.json
    find: '"sources": ['
    payload: '"sources": [{"id": "PROBE-SYMM", "ingestible": true, "source_uri": "https://probe.example/x",
      "content_signal": {"verdict": "no_restriction", "read_on": "2026-08-30", "against_us": ["ai-train=no"]}},'
  - name: той самий день, записаний як ISO з часом — гейт мусить ПРИЙНЯТИ
    kind: replace
    target: config/corpus/doctrine_catalog_2026.json
    find: '"sources": ['
    payload: '"sources": [{"id": "PROBE-ISO", "ingestible": true, "source_uri": "https://probe.example/x",
      "content_signal": {"verdict": "no_restriction", "read_on": "2026-08-30T00:00:00", "against_us":
      []}},'
    equivalent: true
- name: source-manifest-verify
  run:
  - env
  - PYTHONPATH=scripts
  - python3
  - scripts/verify_source_manifest.py
  timeout: 600
  ignore:
  - var
  - htmlcov
  - node_modules
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  poisons:
  - name: файл, описаний маніфестом, змінено
    kind: append
    target: scripts/source_digest.py
    payload: '

      # POISON

      '
  - name: файл поза маніфестом підкладено в дерево
    kind: create
    target: scripts/_injected_by_probe.py
    payload: 'VALUE = 1

      '
  - name: маніфест зник
    kind: delete
    target: SOURCE_MANIFEST.json
- name: handoff-verify
  run:
  - env
  - PYTHONPATH=apps/api/src
  - /home/neuro7/Desktop/Ядро основний проект Корпус/apps/api/.venv/bin/python
  - scripts/verify_handoff_contract.py
  - --require-bound
  timeout: 900
  ignore:
  - var
  - htmlcov
  - node_modules
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  keep:
  - .git
  poisons:
  - name: несучий дайджест не той, що в дереві
    kind: replace
    target: reports/RESEARCH_ASSURANCE_REPORT.json
    find: '"tracked_tree_sha256": "'
    payload: '"tracked_tree_sha256": "0'
  - name: звіт називає чужу область над несучим числом
    kind: replace
    target: reports/RESEARCH_ASSURANCE_REPORT.json
    find: '"tracked_tree_scope": "tracked_tree"'
    payload: '"tracked_tree_scope": "evidence_paths"'
  - name: несуче поле зникло — лишилась лише незіставна область
    kind: replace
    target: reports/RESEARCH_ASSURANCE_REPORT.json
    find: '"tracked_tree_sha256":'
    payload: '"unused_tree_sha256":'
- name: module-budget
  run:
  - env
  - PYTHONPATH=apps/api/src
  - /home/neuro7/Desktop/Ядро основний проект Корпус/apps/api/.venv/bin/python
  - scripts/check_module_budget.py
  timeout: 600
  ignore:
  - var
  - htmlcov
  - node_modules
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  poisons:
  - name: модуль виріс над стелею
    kind: append
    target: scripts/check_module_budget.py
    payload: '

      # POISON

      Z0 = 0

      Z1 = 0

      Z2 = 0

      Z3 = 0

      Z4 = 0

      Z5 = 0

      Z6 = 0

      Z7 = 0

      Z8 = 0

      Z9 = 0

      '
  - name: бюджет зник — новий модуль лишається невиміряним
    kind: delete
    target: config/operations/module-budget.json
  - name: модуль СКОРОТИВСЯ — гейт мусить ПРИЙНЯТИ
    kind: replace
    target: scripts/validate_remote_digest.py
    find: '


      ROOT = Path(__file__).resolve().parents[1]'
    payload: '

      ROOT = Path(__file__).resolve().parents[1]'
    equivalent: true
