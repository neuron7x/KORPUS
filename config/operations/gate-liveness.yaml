  - name: маніфест зник
    kind: delete
    target: SOURCE_MANIFEST.json
# ПЕРЕЙМЕНОВАНО 03.09.2026. Запис звався `handoff-verify`, а запускав
# `verify_handoff_contract.py --require-bound` — тобто рецепт ІНШОЇ цілі,
# `handoff-verify-bound`. Вирок ONE_WAY_FAIL стосувався зв'язаної форми, а сама
# `handoff-verify` (та, що лежить у лані `validate`) вироку про живість не мала
# ЗОВСІМ. Ім'я гейта живості мусить називати ту команду, яку він міряє.
#
# ONE_WAY_FAIL тут очікуваний і НЕ є вадою: BOUND — властивість релізу, яка
# вимагає повного циклу доказів разом із навчанням відновлення PostgreSQL, тож на
# машині розробника зв'язана форма червона за побудовою. Саме тому вона й винесена
# в окрему ціль, а не поставлена в `validate`.
- name: handoff-verify-bound
  # Очікування ONE_WAY_FAIL знято 03.09.2026 (RELEASE CLOSURE §5). Воно означало
  # «цей гейт історично мав падати, тому PASS тепер помилка» — і робило ПОКРАЩЕННЯ
  # системи відмовою. Правильна семантика для гейта, що входить у реліз, одна:
  # чистий предмет → PASS, отруєний → FAIL.
  #
  # Те, що BOUND вимагає повного циклу доказів, не робить його червоним за
  # побудовою: цикл проганяє сам лан закриття (`assurance operational-gate`), і
  # там предмет чистий. Червоний на дереві БЕЗ доказів — це «недосяжне без
  # виробника», а не властивість гейта; називати його очікуваним провалом
  # означало б будувати реліз навколо сталої відмови.
  run:
  - env
  - PYTHONPATH=apps/api/src
  - {python}
  - scripts/verify_handoff_contract.py
  - --require-bound
  timeout: 900
  ignore:
  - var
  - htmlcov
  - node_modules
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  keep:
  - .git
  poisons:
  - name: несучий дайджест не той, що в дереві
    kind: replace
    target: reports/RESEARCH_ASSURANCE_REPORT.json
    find: '"tracked_tree_sha256": "'
    payload: '"tracked_tree_sha256": "0'
  - name: звіт називає чужу область над несучим числом
    kind: replace
    target: reports/RESEARCH_ASSURANCE_REPORT.json
    find: '"tracked_tree_scope": "tracked_tree"'
    payload: '"tracked_tree_scope": "evidence_paths"'
  - name: несуче поле зникло — лишилась лише незіставна область
    kind: replace
    target: reports/RESEARCH_ASSURANCE_REPORT.json
    find: '"tracked_tree_sha256":'
    payload: '"unused_tree_sha256":'
