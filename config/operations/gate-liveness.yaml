- name: validate-repository
  run:
  - python3
  - scripts/validate_repository.py
  - --context
  - FULL_SSOT_DISTRIBUTION
  timeout: 600
  ignore: &id001
  - var
  - htmlcov
  - node_modules
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  poisons:
  - name: обов'язковий файл реєстру прибрано з дерева
    kind: delete
    target: SECURITY.md
  - name: версія веб-пакета розійшлась із release.json
    kind: replace
    target: apps/web/package.json
    find: '"version": "0.9.7"'
    payload: '"version": "9.9.9"'
  keep:
  - .git
- name: validate-infrastructure
  run:
  - python3
  - scripts/validate_infrastructure.py
  timeout: 600
  ignore: *id001
  poisons:
  - name: сервіс compose втратив no-new-privileges
    kind: replace
    target: docker-compose.yml
    find: '    - no-new-privileges:true

      '
    payload: ''
    occurrence: 2
- name: validate-kubernetes
  run:
  - python3
  - scripts/validate_kubernetes.py
  timeout: 600
  ignore: *id001
  poisons:
  - name: кореневу ФС контейнера зроблено записуваною
    kind: replace
    target: deploy/kubernetes/base/web-deployment.yaml
    find: 'readOnlyRootFilesystem: true'
    payload: 'readOnlyRootFilesystem: false'
  - name: 'пошкоджено ЛИШЕ продакшенний оверлей: образ розпінано на :latest'
    kind: append
    target: deploy/kubernetes/overlays/production/kustomization.yaml
    payload: "  - target: {kind: Deployment, name: korpus-api}\n    patch: |-\n      - op: replace\n \
      \       path: /spec/template/spec/containers/0/image\n        value: korpus-api:latest\n"
