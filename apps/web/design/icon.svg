<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="KORPUS">
  <!-- Знак НЕ вигаданий: це та сама форма, що в styles.css задає `.mark` через
       clip-path: polygon(0 0,100% 0,100% 28%,43% 28%,43% 72%,100% 72%,100% 100%,0 100%).
       Кольори взято з tokens.css: фон #010101, знак #c75550, рамка #1b1a18.
       Джерело одне, тож знак у шапці й на іконці не розійдуться мовчки.
       (Подвійний дефіс у XML-коментарі заборонений, тому імена змінних CSS тут
       названо словами, а не записом зі скороченням.) -->
  <rect width="512" height="512" fill="#010101"/>
  <rect x="8" y="8" width="496" height="496" fill="none" stroke="#1b1a18" stroke-width="4"/>
  <!-- Знак займає 320 з 512 (62.5%): менше виглядає загубленим на екрані,
       більше не лишає полів під маску Android. -->
  <g transform="translate(96 96) scale(3.2)">
    <path fill="#c75550" d="M0 0 H100 V28 H43 V72 H100 V100 H0 Z"/>
  </g>
</svg>
