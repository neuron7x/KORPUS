[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "korpus-api"
version = "0.1.0"
description = "Evidence-first knowledge platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.100,<7",
  "jsonschema>=4.23,<5",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/korpus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

# Lint configuration lives in the repository-root ruff.toml so that every path —
# apps, scripts and tools — is checked under identical rules in CI and locally.

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["korpus"]
