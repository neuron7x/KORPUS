[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "korpus-api"
version = "1.0.0"
description = "Evidence-bound controlled-corpus platform API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.128,<1",
  "orjson>=3.11,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "PyJWT[crypto]>=2.10,<3",
  "pypdf>=5.9,<6",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.50,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
korpus = "korpus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/korpus"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: database/API integration test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["korpus"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdf.*"]
ignore_missing_imports = true
