# uses --no-deps, so anything mypy needs must be pinned here by name: without these
# two lines `python -m mypy` aborted with ModuleNotFoundError: No module named
# 'librt' on a clean checkout, and `make api-lint` — and therefore `make check` —
# could not run at all.
